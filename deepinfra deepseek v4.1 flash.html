<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#020406" />
<link rel="icon" href="data:," />
<title>The Glass Sea</title>
<style>
  :root {
    --ink: #e9f2f5;
    --dim: rgba(222, 238, 243, 0.46);
    --faint: rgba(222, 238, 243, 0.22);
    --weather: 0.32;
    --accent: #ffd2a0;
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #020406;
  }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #stage {
    cursor: grab;
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
  }
  #stage:active { cursor: grabbing; }
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 38%, rgba(0,0,0,0.24) 72%, rgba(0,0,0,0.66) 112%),
      linear-gradient(to bottom, rgba(0,0,0,0.30) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 76%, rgba(0,0,0,0.34) 100%);
    z-index: 2;
  }
  #dive-tint {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.8s ease;
    background:
      radial-gradient(ellipse at 50% 56%, rgba(20, 94, 112, 0.03) 0%, rgba(2, 24, 37, 0.30) 76%, rgba(1, 10, 17, 0.55) 100%);
    z-index: 3;
  }
  body.diving #dive-tint { opacity: 1; }

  .hud {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
  }
  .brand {
    position: absolute;
    top: clamp(24px, 4.6vh, 52px);
    left: clamp(24px, 4.8vw, 70px);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 1.5s ease 0.5s, transform 1.5s ease 0.5s;
  }
  body.ready .brand { opacity: 1; transform: translateY(0); }
  .brand .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--dim);
    font-size: 9px;
    line-height: 1;
    letter-spacing: 0.36em;
    text-transform: uppercase;
  }
  .brand .eyebrow::before {
    content: "";
    width: 24px;
    height: 1px;
    background: linear-gradient(90deg, rgba(255,210,160,0.9), rgba(255,210,160,0.08));
  }
  .brand h1 {
    margin: 15px 0 0 -2px;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(28px, 3.1vw, 48px);
    line-height: 0.96;
    letter-spacing: 0.005em;
    text-shadow: 0 0 36px rgba(129, 209, 229, 0.13);
  }
  .brand h1 em {
    font-style: italic;
    color: rgba(238, 247, 249, 0.76);
  }
  .brand .sub {
    margin-top: 11px;
    color: var(--dim);
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 12px;
    letter-spacing: 0.02em;
  }

  #reset {
    position: absolute;
    top: clamp(22px, 4.3vh, 48px);
    right: clamp(24px, 4.6vw, 68px);
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 1px;
    border: 0;
    color: var(--dim);
    background: transparent;
    font: inherit;
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    cursor: pointer;
    opacity: 0;
    transform: translateY(-6px);
    transition: color 0.35s ease, opacity 1.2s ease 0.8s, transform 1.2s ease 0.8s;
  }
  body.ready #reset { opacity: 1; transform: translateY(0); }
  #reset:hover { color: rgba(255, 236, 214, 0.92); }
  #reset svg {
    width: 13px;
    height: 13px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.1;
    transition: transform 0.7s cubic-bezier(.2,.8,.2,1);
  }
  #reset:hover svg { transform: rotate(-95deg); }

  .weather {
    position: absolute;
    left: 50%;
    bottom: clamp(26px, 5.2vh, 54px);
    width: min(390px, calc(100vw - 64px));
    transform: translateX(-50%) translateY(8px);
    pointer-events: auto;
    opacity: 0;
    transition: opacity 1.4s ease 0.9s, transform 1.4s ease 0.9s;
  }
  body.ready .weather { opacity: 1; transform: translateX(-50%) translateY(0); }
  .weather-head {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 13px;
    margin-bottom: 15px;
    color: var(--faint);
    font-size: 8px;
    letter-spacing: 0.40em;
    text-transform: uppercase;
  }
  .weather-head::before,
  .weather-head::after {
    content: "";
    width: 30px;
    height: 1px;
    background: rgba(218, 238, 244, 0.14);
  }
  .weather-head .glyph {
    width: 13px;
    height: 13px;
    border: 1px solid rgba(255, 214, 168, 0.40);
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(255, 192, 128, 0.12);
  }
  .range-wrap {
    position: relative;
    height: 18px;
    display: flex;
    align-items: center;
  }
  #weather {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 18px;
    margin: 0;
    padding: 0;
    background: transparent;
    cursor: ew-resize;
    outline: none;
  }
  #weather::-webkit-slider-runnable-track {
    height: 1px;
    border-radius: 1px;
    background: linear-gradient(90deg,
      #ffd2a0 0%,
      #ffd2a0 calc(var(--weather) * 100%),
      rgba(222, 238, 243, 0.17) calc(var(--weather) * 100%),
      rgba(222, 238, 243, 0.17) 100%);
  }
  #weather::-moz-range-track {
    height: 1px;
    border-radius: 1px;
    background: rgba(222, 238, 243, 0.17);
  }
  #weather::-moz-range-progress {
    height: 1px;
    background: #ffd2a0;
  }
  #weather::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 11px;
    height: 11px;
    margin-top: -5px;
    border-radius: 50%;
    border: 1px solid rgba(255, 246, 233, 0.88);
    background: #f8e8d6;
    box-shadow: 0 0 0 5px rgba(255, 210, 160, 0.07), 0 0 22px rgba(255, 203, 147, 0.52);
    transition: box-shadow 0.3s ease, transform 0.3s ease;
  }
  #weather:hover::-webkit-slider-thumb { box-shadow: 0 0 0 7px rgba(255, 210, 160, 0.10), 0 0 30px rgba(255, 203, 147, 0.72); }
  #weather:active::-webkit-slider-thumb { transform: scale(1.22); }
  #weather::-moz-range-thumb {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid rgba(255, 246, 233, 0.88);
    background: #f8e8d6;
    box-shadow: 0 0 0 5px rgba(255, 210, 160, 0.07), 0 0 22px rgba(255, 203, 147, 0.52);
  }
  .weather-ends {
    display: flex;
    justify-content: space-between;
    margin-top: 7px;
    color: var(--faint);
    font-size: 8px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
  }
  .weather-ends span:last-child { text-align: right; }

  #hint {
    position: absolute;
    left: clamp(24px, 4.8vw, 70px);
    bottom: clamp(30px, 5.6vh, 58px);
    max-width: 190px;
    color: rgba(218, 238, 244, 0.34);
    font-size: 8px;
    line-height: 1.7;
    letter-spacing: 0.23em;
    text-transform: uppercase;
    opacity: 0;
    transform: translateY(5px);
    transition: opacity 1s ease 1.6s, transform 1s ease 1.6s, color 0.5s ease;
  }
  body.ready #hint { opacity: 1; transform: translateY(0); }
  #hint.dim { opacity: 0; }
  #hint .dot {
    display: inline-block;
    width: 4px;
    height: 4px;
    margin: 0 7px 1px 0;
    border-radius: 50%;
    background: rgba(255, 210, 160, 0.75);
    box-shadow: 0 0 8px rgba(255, 201, 143, 0.55);
  }

  #loader {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #020406;
    transition: opacity 1.5s ease, visibility 1.5s ease;
  }
  #loader.hidden { opacity: 0; visibility: hidden; }
  .loader-inner { width: min(280px, 70vw); text-align: center; }
  .loader-inner .mark {
    color: rgba(232, 245, 248, 0.72);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 20px;
    letter-spacing: 0.04em;
  }
  .loader-inner .mark em { color: rgba(232, 245, 248, 0.38); }
  .loader-line {
    position: relative;
    height: 1px;
    margin-top: 22px;
    overflow: hidden;
    background: rgba(220, 240, 245, 0.08);
  }
  .loader-line::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 210, 160, 0.85), rgba(132, 219, 236, 0.85), transparent);
    transform: translateX(-100%);
    animation: load 1.8s cubic-bezier(.45,.05,.55,.95) infinite;
  }
  @keyframes load { to { transform: translateX(100%); } }

  #error {
    position: fixed;
    inset: 0;
    z-index: 110;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 30px;
    background: #020406;
    color: rgba(230, 242, 245, 0.7);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;
    line-height: 1.7;
    text-align: center;
  }

  @media (max-width: 760px) {
    .brand { top: 24px; left: 22px; }
    .brand h1 { font-size: 29px; }
    .brand .sub { font-size: 11px; }
    #reset { top: 24px; right: 22px; }
    .weather { bottom: 22px; width: min(340px, calc(100vw - 48px)); }
    #hint { left: 22px; bottom: 84px; max-width: 140px; font-size: 7px; }
  }
  @media (max-height: 560px) {
    .brand .sub { display: none; }
    .brand h1 { font-size: 25px; margin-top: 10px; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="An interactive miniature ocean inside a glass cube"></canvas>
<div id="vignette"></div>
<div id="dive-tint"></div>

<div class="hud">
  <div class="brand">
    <div class="eyebrow">A contained ocean</div>
    <h1>The Glass <em>Sea</em></h1>
    <div class="sub">weather study no. 01</div>
  </div>

  <button id="reset" type="button" aria-label="Reset view">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M3.1 6.1A5.1 5.1 0 1 1 3 9.6" />
      <path d="M3.1 2.9v3.4h3.4" />
    </svg>
    Reset view
  </button>

  <div class="weather">
    <div class="weather-head"><span class="glyph"></span><span>Weather</span><span class="glyph"></span></div>
    <div class="range-wrap">
      <input id="weather" type="range" min="0" max="1" step="0.001" value="0.42" aria-label="Weather, from sunrise to midnight storm" />
    </div>
    <div class="weather-ends"><span>Sunrise</span><span>Midnight storm</span></div>
  </div>

  <div id="hint"><span class="dot"></span>Click the whale to dive</div>
</div>

<div id="loader">
  <div class="loader-inner">
    <div class="mark">The Glass <em>Sea</em></div>
    <div class="loader-line"></div>
  </div>
</div>
<div id="error">This study needs WebGL.<br />Please open it in a current browser with hardware acceleration enabled.</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

/* --------------------------------------------------------------------------
   The Glass Sea — a miniature weather system in a floating glass cube.
   Every texture, shader, creature and wave is generated in this file.
   -------------------------------------------------------------------------- */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
const seeded = (n) => {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
  return x - Math.floor(x);
};

const CUBE = {
  w: 9.2,
  h: 7.8,
  d: 9.2,
  bottom: -3.4,
  top: 4.4,
  waterline: 2.6
};
CUBE.cy = (CUBE.bottom + CUBE.top) * 0.5;
const FLOOR_Y = -4.55;

const canvas = document.getElementById('stage');
const loader = document.getElementById('loader');
const errorPanel = document.getElementById('error');
const hint = document.getElementById('hint');
const resetButton = document.getElementById('reset');
const weatherInput = document.getElementById('weather');

let renderer;
try {
  renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: false,
    powerPreference: 'high-performance'
  });
} catch (err) {
  loader.classList.add('hidden');
  errorPanel.style.display = 'flex';
  throw err;
}

const IS_MOBILE = window.innerWidth < 800;
const DPR = Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 1.5 : 1.75);
renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = false;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020406);

const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.08, 140);
const BASE_HOME_POS = new THREE.Vector3(12.9, 7.7, 15.4);
const BASE_HOME_TARGET = new THREE.Vector3(0, 0.42, 0);
const homePos = BASE_HOME_POS.clone();
const homeTarget = BASE_HOME_TARGET.clone();
function refreshCameraHomes() {
  const aspect = window.innerWidth / Math.max(window.innerHeight, 1);
  const portrait = aspect < 0.95;
  const scale = portrait ? clamp(0.92 / Math.max(aspect, 0.35), 1, 1.58) : 1;
  homePos.copy(BASE_HOME_TARGET).addScaledVector(BASE_HOME_POS.clone().sub(BASE_HOME_TARGET), scale);
  homeTarget.copy(BASE_HOME_TARGET);
  camera.fov = portrait ? 41 : 36;
  camera.updateProjectionMatrix();
}
refreshCameraHomes();
camera.position.copy(homePos);

const controls = new OrbitControls(camera, canvas);
controls.target.copy(homeTarget);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.65;
controls.panSpeed = 0.5;
controls.minDistance = 5.0;
controls.maxDistance = 44;
controls.minPolarAngle = 0.14;
controls.maxPolarAngle = Math.PI * 0.505;
controls.enablePan = false;
controls.update();

const composer = new EffectComposer(renderer);
composer.setPixelRatio(DPR);
composer.setSize(window.innerWidth, window.innerHeight);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.48, 0.72, 0.82
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* --------------------------------------------------------------------------
   Generated textures
   -------------------------------------------------------------------------- */

function canvasTexture(size, draw, colorSpace = THREE.SRGBColorSpace) {
  const c = document.createElement('canvas');
  c.width = size;
  c.height = size;
  const ctx = c.getContext('2d');
  draw(ctx, size);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = colorSpace;
  tex.needsUpdate = true;
  return tex;
}

const glowTex = canvasTexture(256, (ctx, s) => {
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.16, 'rgba(255,255,255,0.72)');
  g.addColorStop(0.48, 'rgba(255,255,255,0.16)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
}, THREE.NoColorSpace);

const shadowTex = canvasTexture(256, (ctx, s) => {
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(255,255,255,0.92)');
  g.addColorStop(0.34, 'rgba(255,255,255,0.60)');
  g.addColorStop(0.68, 'rgba(255,255,255,0.16)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
}, THREE.NoColorSpace);

const floorFadeTex = canvasTexture(512, (ctx, s) => {
  const g = ctx.createRadialGradient(s / 2, s / 2, s * 0.06, s / 2, s / 2, s * 0.51);
  g.addColorStop(0, 'rgba(2,4,7,0.04)');
  g.addColorStop(0.25, 'rgba(2,4,7,0.10)');
  g.addColorStop(0.48, 'rgba(2,4,7,0.32)');
  g.addColorStop(0.72, 'rgba(2,4,7,0.78)');
  g.addColorStop(1, 'rgba(2,4,7,1)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
});

const floorPoolTex = canvasTexture(256, (ctx, s) => {
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(255,255,255,0.65)');
  g.addColorStop(0.22, 'rgba(255,255,255,0.34)');
  g.addColorStop(0.55, 'rgba(255,255,255,0.09)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
}, THREE.NoColorSpace);

function makeWaterNormalMap(size = 256) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const waves = [];
  let seed = 1.37;
  for (let i = 0; i < 14; i++) {
    seed = seeded(seed + i * 7.13);
    const fx = Math.round(lerp(-9, 9, seeded(seed + 0.21)));
    const fy = Math.round(lerp(-9, 9, seeded(seed + 0.83)));
    if (fx === 0 && fy === 0) continue;
    const mag = Math.hypot(fx, fy);
    waves.push({
      fx, fy,
      phase: seeded(seed + 1.71) * TAU,
      amp: 0.9 / Math.pow(mag, 0.85)
    });
  }
  const heights = new Float32Array(size * size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      let h = 0;
      for (let w = 0; w < waves.length; w++) {
        const wave = waves[w];
        h += wave.amp * Math.sin(TAU * (wave.fx * x / size + wave.fy * y / size) + wave.phase);
      }
      heights[y * size + x] = h;
    }
  }
  let maxGrad = 0.0001;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const l = heights[y * size + ((x - 1 + size) % size)];
      const r = heights[y * size + ((x + 1) % size)];
      const d = heights[((y - 1 + size) % size) * size + x];
      const u = heights[((y + 1) % size) * size + x];
      maxGrad = Math.max(maxGrad, Math.abs(r - l), Math.abs(u - d));
    }
  }
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const l = heights[y * size + ((x - 1 + size) % size)];
      const r = heights[y * size + ((x + 1) % size)];
      const d = heights[((y - 1 + size) % size) * size + x];
      const u = heights[((y + 1) % size) * size + x];
      const nx = -(r - l) / maxGrad * 2.5;
      const ny = -(u - d) / maxGrad * 2.5;
      const len = Math.hypot(nx, ny, 1);
      const i = (y * size + x) * 4;
      img.data[i] = Math.round((nx / len * 0.5 + 0.5) * 255);
      img.data[i + 1] = Math.round((ny / len * 0.5 + 0.5) * 255);
      img.data[i + 2] = Math.round((1 / len * 0.5 + 0.5) * 255);
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.NoColorSpace;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return tex;
}
const waterNormalMap = makeWaterNormalMap(256);

function makeEnvironment() {
  const c = document.createElement('canvas');
  c.width = 1024;
  c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, '#07101b');
  g.addColorStop(0.38, '#142b3b');
  g.addColorStop(0.48, '#a98464');
  g.addColorStop(0.52, '#112a3b');
  g.addColorStop(0.72, '#07131e');
  g.addColorStop(1, '#010305');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1024, 512);
  const blobs = [
    [230, 200, 150, 'rgba(255,198,141,0.28)'],
    [730, 180, 210, 'rgba(125,196,218,0.16)'],
    [510, 260, 300, 'rgba(50,95,118,0.20)']
  ];
  for (const [x, y, r, color] of blobs) {
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, color);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const env = pmrem.fromEquirectangular(tex).texture;
  tex.dispose();
  pmrem.dispose();
  return env;
}

const skyMaterial = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  side: THREE.BackSide,
  uniforms: skyUniforms,
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vec4 world = modelMatrix * vec4(position, 1.0);
      vWorldPos = world.xyz;
      gl_Position = projectionMatrix * viewMatrix * world;
    }
  `,
  fragmentShader: `
    precision highp float;
    uniform float uTime;
    uniform vec3 uTop;
    uniform vec3 uHorizon;
    uniform vec3 uCloud;
    uniform vec3 uSun;
    uniform vec3 uSunDir;
    uniform float uSunIntensity;
    uniform float uCloudiness;
    uniform float uFlash;
    uniform float uWaterline;
    varying vec3 vWorldPos;

    float hash(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }
    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash(i);
      float b = hash(i + vec2(1.0, 0.0));
      float c = hash(i + vec2(0.0, 1.0));
      float d = hash(i + vec2(1.0, 1.0));
      return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }
    float fbm(vec2 p) {
      float v = 0.0;
      float a = 0.5;
      for (int i = 0; i < 5; i++) {
        v += a * noise(p);
        p = p * 2.03 + 9.1;
        a *= 0.5;
      }
      return v;
    }

    void main() {
      vec3 dir = normalize(vWorldPos - vec3(0.0, uWaterline, 0.0));
      float h = clamp(dir.y, 0.0, 1.0);
      float grad = smoothstep(0.0, 0.175, h);
      vec3 col = mix(uHorizon, uTop, grad);
      col = mix(col, uTop * 0.30, smoothstep(0.34, 1.0, h) * 0.62);

      float az = atan(dir.z, dir.x);
      vec2 cuv = vec2(az * 1.55 + uTime * 0.006, h * 4.6 + uTime * 0.0028);
      float cloudField = fbm(cuv + fbm(cuv * 1.9 + 4.2 - uTime * 0.004) * 0.72);
      float clouds = smoothstep(0.46, 0.69, cloudField);
      float cloudDetail = fbm(cuv * 3.2 + uTime * 0.014 + 7.0);
      clouds *= smoothstep(0.24, 0.70, cloudDetail + 0.26);
      clouds *= smoothstep(0.0, 0.075, h);
      vec3 cloudShade = uCloud * (0.52 + 0.48 * cloudDetail);
      col = mix(col, cloudShade, clouds * uCloudiness);

      float sunDot = max(dot(dir, uSunDir), 0.0);
      float sunCore = pow(sunDot, 1100.0);
      float sunHalo = pow(sunDot, 22.0);
      col += uSun * sunCore * 2.4 * uSunIntensity;
      col += uSun * sunHalo * 0.075 * uSunIntensity;
      col += uSun * clouds * sunHalo * 0.42 * uSunIntensity;

      float horizonGlow = exp(-pow((h - 0.006) * 18.0, 2.0));
      col += uHorizon * horizonGlow * 0.10;

      col += vec3(0.55, 0.70, 0.92) * uFlash * (0.26 + clouds * 2.0 + cloudDetail * 0.5);
      gl_FragColor = vec4(col, 0.975);
    }
  `
});

    varying vec2 vUv;
    void main() {
      vec4 world = modelMatrix * vec4(position, 1.0);
      vWorldPos = world.xyz;

      gl_Position = projectionMatrix * viewMatrix * world;

    uniform vec3 uTint;
    uniform float uOpacity;
    uniform float uTime;
    uniform float uFlash;
    varying vec3 vWorldPos;
    varying vec3 vNormalW;
    varying vec2 vUv;
    void main() {
      vec3 N = normalize(vNormalW);
      vec3 V = normalize(cameraPosition - vWorldPos);
      float fres = pow(1.0 - abs(dot(N, V)), 3.0);
      float diagonal = exp(-pow((vUv.x * 1.25 - vUv.y + 0.13 - sin(uTime * 0.025) * 0.03), 2.0) / 0.012);
      float vertical = exp(-pow((vUv.x - 0.18), 2.0) / 0.05) * 0.30;
      float edge = smoothstep(0.0, 0.055, vUv.x) * smoothstep(1.0, 0.945, vUv.x);
      edge *= smoothstep(0.0, 0.055, vUv.y) * smoothstep(1.0, 0.945, vUv.y);
      float a = (0.012 + fres * 0.16 + diagonal * 0.09 + vertical * 0.055) * uOpacity * edge;
      vec3 col = uTint * (0.55 + fres * 1.25) + vec3(0.65, 0.86, 0.95) * diagonal * 0.24;
      col += vec3(0.55, 0.74, 0.92) * uFlash * (0.15 + fres * 0.7);
      gl_FragColor = vec4(col, a);
    }
  `
});

  uSunColor: { value: PALETTE.calm.sun.clone() },
  uBeamColor: { value: PALETTE.calm.beam.clone() },
  uSunDir: { value: new THREE.Vector3(-0.56, 0.24, -0.79).normalize() },
  uSunIntensity: { value: 1.2 },
  uNormalMap: { value: waterNormalMap },
  uShipPos: { value: new THREE.Vector2(0, 0) },
  uShipDir: { value: new THREE.Vector2(1, 0) }
};

const waterSegments = IS_MOBILE ? 168 : 240;
const waterGeometry = new THREE.PlaneGeometry(CUBE.w - 0.055, CUBE.d - 0.055, waterSegments, waterSegments);
waterGeometry.rotateX(-Math.PI / 2);

const waterMaterial = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: true,
  side: THREE.DoubleSide,
  uniforms: waterUniforms,
  vertexShader: `
    precision highp float;
    uniform float uTime;
    uniform float uAmpScale;
    uniform float uSpeedScale;
    uniform float uChop;
    uniform vec2 uDir[5];
    uniform float uAmp[5];
    uniform float uK[5];
    uniform float uSpd[5];
    varying vec3 vWorldPos;
    varying vec3 vNormalW;
    varying float vHeight;

    void main() {
      vec3 p = position;
      float ddx = 0.0;
      float ddz = 0.0;
      float h = 0.0;
      for (int i = 0; i < 5; i++) {
        vec2 d = uDir[i];
        float amp = uAmp[i] * uAmpScale;
        float phase = uK[i] * dot(d, p.xz) - uSpd[i] * uSpeedScale * uTime;
        float s = sin(phase);
        float c = cos(phase);
        p.y += amp * s;
        p.x += uChop * amp * d.x * c;
        p.z += uChop * amp * d.y * c;
        ddx += amp * uK[i] * d.x * c;
        ddz += amp * uK[i] * d.y * c;
        h += amp * s;
      }
      vec3 n = normalize(vec3(-ddx, 1.0, -ddz));
      vec4 world = modelMatrix * vec4(p, 1.0);
      vWorldPos = world.xyz;
      vNormalW = normalize(mat3(modelMatrix) * n);
      vHeight = h;
      gl_Position = projectionMatrix * viewMatrix * world;
    }
  `,
  fragmentShader: `
    precision highp float;
    uniform float uTime;
    uniform float uAmpScale;
    uniform float uStorm;
    uniform float uFoam;
    uniform float uRain;
    uniform float uDetail;
    uniform float uFlash;
    uniform vec3 uDeep;
    uniform vec3 uShallow;
    uniform vec3 uFoamColor;
    uniform vec3 uSkyHorizon;
    uniform vec3 uSkyZenith;
    uniform vec3 uSunColor;
    uniform vec3 uBeamColor;
    uniform vec3 uSunDir;
    uniform float uSunIntensity;
    uniform sampler2D uNormalMap;
    uniform vec2 uShipPos;
    uniform vec2 uShipDir;
    varying vec3 vWorldPos;
    varying vec3 vNormalW;
    varying float vHeight;

    float hash(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }
    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash(i);
      float b = hash(i + vec2(1.0, 0.0));
      float c = hash(i + vec2(0.0, 1.0));
      float d = hash(i + vec2(1.0, 1.0));
      return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }
    float fbm(vec2 p) {
      float v = 0.0;
      float a = 0.5;
      for (int i = 0; i < 4; i++) {
        v += a * noise(p);
        p = p * 2.04 + 7.7;
        a *= 0.5;
      }
      return v;
    }

    void main() {
      vec3 N = normalize(vNormalW);
      vec3 n1 = texture2D(uNormalMap, vWorldPos.xz * 0.155 + vec2(uTime * 0.009, uTime * 0.004)).rgb * 2.0 - 1.0;
      vec3 n2 = texture2D(uNormalMap, vWorldPos.xz * 0.325 + vec2(-uTime * 0.013, uTime * 0.007)).rgb * 2.0 - 1.0;
      N = normalize(N + vec3(n1.x + n2.x * 0.62, 0.0, n1.y + n2.y * 0.62) * uDetail);
      if (!gl_FrontFacing) N = -N;

      vec3 V = normalize(cameraPosition - vWorldPos);
      float ndv = clamp(dot(N, V), 0.0, 1.0);
      float fres = pow(1.0 - ndv, 3.6);

      vec3 R = reflect(-V, N);
      float rh = clamp(R.y, 0.0, 1.0);
      vec3 sky = mix(uSkyHorizon, uSkyZenith, pow(rh, 0.66));
      sky += uSunColor * pow(max(dot(R, uSunDir), 0.0), 42.0) * uSunIntensity * 0.12;

      vec3 body = mix(uDeep, uShallow, pow(1.0 - ndv, 1.35) * 0.62 + 0.08);
      float sss = pow(max(dot(-V, uSunDir), 0.0), 3.0);
      body += uShallow * sss * 0.10;
      vec3 col = mix(body, sky, fres * 0.47);

      vec3 H = normalize(V + uSunDir);
      float spec = pow(max(dot(N, H), 0.0), 190.0) * uSunIntensity * 0.62;
      spec += pow(max(dot(N, H), 0.0), 900.0) * uSunIntensity * 1.0 * smoothstep(0.2, 0.9, noise(vWorldPos.xz * 15.0 + uTime * 0.4));
      col += uSunColor * spec;
      col += uBeamColor * uFlash * (0.12 + fres * 0.55);

      float hn = vHeight / max(uAmpScale * ${WAVE_TOTAL_AMP.toFixed(4)}, 0.0001);
      float crestNoise = noise(vWorldPos.xz * 1.9 + vec2(uTime * 0.10, -uTime * 0.08));
      float crestMask = smoothstep(0.64, 0.96, hn + crestNoise * 0.10 - (1.0 - uStorm) * 0.20);
      float breakup = fbm(vWorldPos.xz * 26.0 + vec2(uTime * 0.36, -uTime * 0.22));
      float fineFoam = smoothstep(0.49, 0.67, breakup + crestMask * 0.13) * crestMask * 0.92;
      vec2 streakUV = vec2(vWorldPos.x * 2.2 + vWorldPos.z * 0.55, vWorldPos.z * 16.0);
      float streakNoise = fbm(streakUV + vec2(uTime * 0.46, -uTime * 0.08));
      float windStreaks = smoothstep(0.76, 0.93, streakNoise) * smoothstep(0.55, 1.0, uStorm) * 0.16;
      float foam = (fineFoam + windStreaks) * uFoam;

      vec2 sdir = normalize(uShipDir);
      vec2 rel = vWorldPos.xz - uShipPos;
      float fwd = dot(rel, sdir);
      float side = dot(rel, vec2(-sdir.y, sdir.x));
      float hull = exp(-length(rel * vec2(1.2, 2.5)) * 5.8);
      float wakeTrail = (1.0 - smoothstep(-2.4, 0.25, fwd)) * exp(-abs(side) * 8.0);
      wakeTrail *= 0.55 + 0.45 * noise(vWorldPos.xz * 7.0 + uTime * 0.3);
      float vWake = (1.0 - smoothstep(0.015, 0.18, abs(abs(side) - max(0.0, -fwd) * 0.28)));
      vWake *= (1.0 - smoothstep(-2.0, 0.2, fwd)) * 0.22;
      float wakeBreak = smoothstep(0.28, 0.72, noise(vWorldPos.xz * 13.0 + uTime * 0.4));
      foam += (hull * 0.42 + wakeTrail * 0.14 + vWake) * (0.40 + uStorm * 0.40) * (0.35 + wakeBreak * 0.65);

      float ripple = 0.0;
      for (int i = 0; i < 5; i++) {
        vec2 c = vec2(hash(vec2(float(i), 2.0)) * 7.0 - 3.5, hash(vec2(float(i), 5.0)) * 7.0 - 3.5);
        float d = length(vWorldPos.xz - c);
        float ph = fract(uTime * 0.33 + hash(vec2(float(i), 9.0)));
        float r = ph * 1.45;
        float ring = sin(55.0 * (d - r)) * exp(-16.0 * abs(d - r)) * (1.0 - ph);
        ripple += ring;
        N = normalize(N + vec3((vWorldPos.x - c.x) / max(d, 0.001), 0.0, (vWorldPos.z - c.y) / max(d, 0.001)) * ring * uRain * 0.024);
      }
      foam += max(ripple, 0.0) * uRain * 0.075;
      foam = clamp(foam, 0.0, 1.0);

      vec3 foamCol = uFoamColor * (0.84 + 0.24 * noise(vWorldPos.xz * 11.0));
      foamCol += uBeamColor * uFlash * 0.8;
      col = mix(col, foamCol, foam);

      if (!gl_FrontFacing) {
        col = mix(col, uShallow * 0.48 + uDeep * 0.28, 0.58);
        col += uBeamColor * 0.055;
        col += uBeamColor * uFlash * 0.25;
        gl_FragColor = vec4(col, 0.70);
      } else {
        col += uBeamColor * uFlash * fres * 0.45;
        gl_FragColor = vec4(col, 0.985);
      }
    }
  `
});

const water = new THREE.Mesh(waterGeometry, waterMaterial);
water.position.y = CUBE.waterline;
water.renderOrder = 6;
scene.add(water);

function waveHeightAt(x, z, t, ampScale, speedScale) {
  let h = 0;
  for (let i = 0; i < WAVES.length; i++) {
    const w = WAVES[i];
    const k = TAU / w.len;
    const phase = k * (w.dir.x * x + w.dir.y * z) - w.speed * speedScale * t;
    h += w.amp * ampScale * Math.sin(phase);
  }
  return h;
}

const beamUniformsList = [];

`;
const beamFragment = `
  precision highp float;
  uniform vec3 uColor;
  uniform float uTime;
  uniform float uSeed;
  uniform float uOpacity;
  varying vec2 vUv;
  void main() {
    float edge = smoothstep(0.0, 0.26, vUv.x) * smoothstep(1.0, 0.74, vUv.x);

`;

}

    depthWrite: false,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    uniforms: causticUniforms,
    vertexShader: `
      varying vec2 vUv;

      void main() {
        vUv = uv;
        vec4 world = modelMatrix * vec4(position, 1.0);
        vWorldPos = world.xyz;
        gl_Position = projectionMatrix * viewMatrix * world;

    `,
    fragmentShader: `
      precision highp float;
      uniform float uTime;
      uniform vec3 uColor;
      uniform float uOpacity;
      uniform float uFlash;
      varying vec2 vUv;
      varying vec3 vWorldPos;
      float hash(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }
      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a = hash(i);
        float b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0));
        float d = hash(i + vec2(1.0, 1.0));
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
      }
      float caustic(vec2 p, float t) {
        vec2 q = p;

        for (int i = 0; i < 3; i++) {

        return pow(clamp(1.0 - v / 6.0, 0.0, 1.0), 4.0);

      void main() {

    `

}

function addSchool(count, cx, cy, cz, rx, rz, speed, scale, phase, hueShift) {
  const mesh = new THREE.InstancedMesh(fishGeometry, fishMaterial, count);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  const fish = [];
  const color = new THREE.Color();
  for (let i = 0; i < count; i++) {
    const r = seeded(i * 3.17 + phase * 4.1 + 1.0);
    const r2 = seeded(i * 5.91 + phase * 2.7 + 3.0);
    const r3 = seeded(i * 7.73 + phase * 9.1 + 5.0);
    const angle = i / count * TAU + phase + r * 0.8;
    fish.push({
      angle,
      angleJitter: r2 * 0.9,
      radius: 0.54 + r * 0.60,
      yJitter: (r3 - 0.5) * 0.55,
      speedJitter: 0.78 + r2 * 0.52,
      size: scale * (0.78 + r3 * 0.50),
      phase: r * TAU,
      roll: (r3 - 0.5) * 1.15
    });
    color.setHSL(0.51 + hueShift + r2 * 0.035, 0.20 + r * 0.14, 0.50 + r3 * 0.13);
    mesh.setColorAt(i, color);
  }
  mesh.instanceColor.needsUpdate = true;
  scene.add(mesh);
  fishSchools.push({ mesh, fish, cx, cy, cz, rx, rz, speed, phase });
}

const fishPosition = new THREE.Vector3();
const fishForward = new THREE.Vector3(1, 0, 0);

function fishPositionAt(school, f, time, out) {
  const a = f.angle + time * school.speed * f.speedJitter;
  const r = f.radius;
  out.set(
    school.cx + Math.cos(a) * school.rx * r + Math.sin(a * 2.3 + f.phase) * 0.13,
    school.cy + f.yJitter + Math.sin(a * 1.7 + f.phase) * 0.17,
    school.cz + Math.sin(a) * school.rz * r + Math.cos(a * 2.0 + f.phase) * 0.13
  );
  return out;
}

function updateFish(time) {
  for (const school of fishSchools) {
    for (let i = 0; i < school.fish.length; i++) {
      const f = school.fish[i];
      fishPositionAt(school, f, time, fishPosition);
      fishPositionAt(school, f, time + 0.04, fishVelocity);
      fishVelocity.sub(fishPosition);
      fishVelocity.y += Math.sin(time * 1.2 + f.phase) * 0.02;
      const len = fishVelocity.length();
      if (len > 0.00001) fishVelocity.multiplyScalar(1 / len);
      fishDummy.position.copy(fishPosition);
      fishDummy.quaternion.setFromUnitVectors(fishForward, fishVelocity);
      fishDummy.rotateX(f.roll);
      fishDummy.scale.setScalar(f.size);
      fishDummy.updateMatrix();
      school.mesh.setMatrixAt(i, fishDummy.matrix);
    }
    school.mesh.instanceMatrix.needsUpdate = true;
  }
}

const WHALE_LENGTH = 4.8;
const whaleTopColor = new THREE.Color(0x173044);
const whaleBellyColor = new THREE.Color(0x6f8b94);

function whaleRadius(u) {
  const profile = [
    [0.00, 0.060],
    [0.045, 0.190],
    [0.11, 0.370],
    [0.21, 0.540],
    [0.34, 0.665],
    [0.49, 0.720],
    [0.63, 0.705],
    [0.75, 0.630],
    [0.85, 0.505],
    [0.91, 0.415],
    [0.96, 0.330],
    [1.00, 0.185]
  ];
  for (let i = 0; i < profile.length - 1; i++) {
    const a = profile[i];
    const b = profile[i + 1];
    if (u >= a[0] && u <= b[0]) {
      const t = smoothstep(a[0], b[0], u);
      return lerp(a[1], b[1], t);
    }
  }
  return profile[profile.length - 1][1];
}

function makeWhaleBody() {
  const N = 64;
  const M = 32;
  const positions = [];
  const colors = [];
  const indices = [];
  const cTop = whaleTopColor.clone();
  const cBelly = whaleBellyColor.clone();
  const c = new THREE.Color();
  for (let i = 0; i <= N; i++) {
    const u = i / N;
    const x = -WHALE_LENGTH * 0.5 + u * WHALE_LENGTH;
    const r = whaleRadius(u);
    const ry = r * 0.80;
    const rz = r * 0.62;
    for (let j = 0; j <= M; j++) {
      const theta = j / M * TAU;
      const sy = Math.sin(theta);
      const cz = Math.cos(theta);
      const y = sy * ry;
      const z = cz * rz;
      positions.push(x, y, z);
      const topness = clamp(y / Math.max(ry, 0.0001) * 0.5 + 0.5, 0, 1);
      const shade = 0.90 + 0.10 * Math.sin(x * 5.7 + theta * 3.1);
      c.copy(cBelly).lerp(cTop, smoothstep(0.18, 0.86, topness));
      c.multiplyScalar(shade);
      colors.push(c.r, c.g, c.b);
    }
  }
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < M; j++) {
      const a = i * (M + 1) + j;
      const b = a + 1;
      const cc = a + (M + 1);
      const d = cc + 1;
      indices.push(a, cc, b, b, cc, d);
    }
  }
  // Round the nose and close the tail.
  const noseIndex = positions.length / 3;
  positions.push(WHALE_LENGTH * 0.5 + 0.025, 0, 0);
  c.copy(cTop).multiplyScalar(0.95);
  colors.push(c.r, c.g, c.b);
  const tailIndex = positions.length / 3;
  positions.push(-WHALE_LENGTH * 0.5 - 0.015, 0, 0);
  c.copy(cTop).multiplyScalar(0.72);
  colors.push(c.r, c.g, c.b);
  const lastRing = N * (M + 1);
  for (let j = 0; j < M; j++) {
    indices.push(lastRing + j, noseIndex, lastRing + j + 1);
    indices.push(j + 1, tailIndex, j);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('aColor', new THREE.Float32BufferAttribute(colors, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

function makeFinGeometry(points, color, thickness = 0) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
  shape.closePath();
  let geo;
  if (thickness > 0) {
    geo = new THREE.ExtrudeGeometry(shape, {
      depth: thickness,
      bevelEnabled: true,
      bevelSize: 0.012,
      bevelThickness: 0.010,
      bevelSegments: 1,
      curveSegments: 6
    });
    geo.translate(0, 0, -thickness * 0.5);
  } else {
    geo = new THREE.ShapeGeometry(shape, 8);
  }
  const count = geo.attributes.position.count;
  const colors = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    colors[i * 3] = color.r;
    colors[i * 3 + 1] = color.g;
    colors[i * 3 + 2] = color.b;
  }
  geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
  return geo;
}

const whaleUniforms = {
  uDeep: { value: PALETTE.calm.waterVolumeDeep.clone() },
  uLight: { value: PALETTE.calm.beam.clone() },
  uRim: { value: PALETTE.calm.whaleRim.clone() },
  uTime: { value: 0 },
  uFlash: { value: 0 },
  uWaterline: { value: CUBE.waterline }
};

const whaleMaterial = new THREE.ShaderMaterial({
  side: THREE.DoubleSide,
  uniforms: whaleUniforms,
  vertexShader: `
    attribute vec3 aColor;
    varying vec3 vWorldPos;
    varying vec3 vNormalW;
    varying vec3 vColor;
    void main() {
      vec4 world = modelMatrix * vec4(position, 1.0);
      vWorldPos = world.xyz;
      vNormalW = normalize(mat3(modelMatrix) * normal);
      vColor = aColor;
      gl_Position = projectionMatrix * viewMatrix * world;
    }
  `,
  fragmentShader: `
    precision highp float;
    uniform vec3 uDeep;
    uniform vec3 uLight;
    uniform vec3 uRim;
    uniform float uTime;
    uniform float uFlash;
    uniform float uWaterline;
    varying vec3 vWorldPos;
    varying vec3 vNormalW;
    varying vec3 vColor;

    float caustic(vec2 p, float t) {
      vec2 q = p;
      float v = 0.0;
      for (int i = 0; i < 2; i++) {
        q = q * 1.7 + vec2(sin(t * 0.2 + float(i)), cos(t * 0.16 + float(i)));
        v += abs(sin(q.x * 2.5 + sin(q.y * 1.8 + t * 0.6)) + sin(q.y * 2.7 + cos(q.x * 2.0 - t * 0.5)));
      }
      return pow(clamp(1.0 - v / 4.0, 0.0, 1.0), 4.0);
    }

    void main() {
      vec3 N = normalize(vNormalW);
      if (!gl_FrontFacing) N = -N;
      vec3 V = normalize(cameraPosition - vWorldPos);
      vec3 L = normalize(vec3(-0.28, 0.88, 0.48));
      float diff = max(dot(N, L), 0.0);
      float wrap = max(dot(N, normalize(vec3(0.28, -0.35, 0.90))), 0.0);
      float depth = clamp((uWaterline - vWorldPos.y) / 5.4, 0.0, 1.0);
      vec3 ambient = mix(uLight * 0.25, uDeep * 0.18, depth);
      vec3 col = vColor * (ambient + diff * 0.94);
      float mottle = sin(vWorldPos.x * 7.0 + sin(vWorldPos.z * 11.0)) * sin(vWorldPos.y * 13.0 + vWorldPos.z * 3.0);
      col *= 0.94 + 0.06 * mottle;
      col += uLight * wrap * 0.10;
      float fres = pow(1.0 - max(dot(N, V), 0.0), 2.4);
      col += uRim * fres * (0.76 + uFlash * 1.5);
      float underFill = max(dot(N, normalize(vec3(0.10, -0.62, 0.40))), 0.0);
      col += uRim * underFill * 0.055;
      float ca = caustic(vWorldPos.xz * 0.55 + vWorldPos.y * 0.2, uTime);
      ca *= smoothstep(-2.8, uWaterline, vWorldPos.y);
      col += uLight * ca * 0.045;
      float dist = length(cameraPosition - vWorldPos);
      col = mix(col, uDeep * 1.2, smoothstep(5.0, 19.0, dist) * 0.52);
      col += vec3(0.35, 0.55, 0.75) * uFlash * 0.12;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});

  const a = t * 0.055 + 1.0;
  out.set(
    Math.cos(a) * 1.70,
    -1.08 + Math.sin(a * 1.8 + 0.5) * 0.13,
    Math.sin(a) * 1.38 + 0.10
  );
  return out;
};

function updateShip(time, ampScale, speedScale, storm) {
  const driftX = 0.35 + Math.sin(time * 0.047) * 0.82;
  const driftZ = 0.10 + Math.cos(time * 0.039) * 0.62;
  shipHeading = 0.35 + Math.sin(time * 0.021) * 0.34;
  ship.position.x = driftX;
  ship.position.z = driftZ;

  const hx = Math.cos(shipHeading);
  const hz = Math.sin(shipHeading);
  const beam = 0.36;
  const length = 0.92;
  const hBow = waveHeightAt(driftX + hx * length * 0.5, driftZ + hz * length * 0.5, time, ampScale, speedScale);
  const hStern = waveHeightAt(driftX - hx * length * 0.5, driftZ - hz * length * 0.5, time, ampScale, speedScale);
  const hStb = waveHeightAt(driftX - hz * beam * 0.5, driftZ + hx * beam * 0.5, time, ampScale, speedScale);
  const hPort = waveHeightAt(driftX + hz * beam * 0.5, driftZ - hx * beam * 0.5, time, ampScale, speedScale);
  const avg = (hBow + hStern + hPort + hStb) * 0.25;
  const pitch = Math.atan2(hBow - hStern, length);
  const roll = -Math.atan2(hStb - hPort, beam);
  const struggle = 0.92 + storm * 0.42;
  ship.position.y = CUBE.waterline + avg - 0.018;
  ship.rotation.y = -shipHeading;
  ship.rotation.x = clamp(roll * struggle + Math.sin(time * 2.1) * 0.012 * storm, -0.52, 0.52);
  ship.rotation.z = clamp(pitch * struggle + Math.sin(time * 1.65 + 1.0) * 0.01 * storm, -0.50, 0.50);
  shipWaveSample.x = driftX;
  shipWaveSample.z = driftZ;
  shipLight.position.set(driftX, CUBE.waterline + avg + 0.18, driftZ);
  shipLight.intensity = 0.10 + storm * 0.18;
  waterUniforms.uShipPos.value.set(driftX, driftZ);
  waterUniforms.uShipDir.value.set(hx, hz);
}

/* --------------------------------------------------------------------------
   Rain and lightning
   -------------------------------------------------------------------------- */

const RAIN_COUNT = 820;
const rainDrops = [];
const rainPositions = new Float32Array(RAIN_COUNT * 6);
for (let i = 0; i < RAIN_COUNT; i++) {
  rainDrops.push({
    x: 0, y: 0, z: 0,
    speed: 1, len: 0.15
  });
}
const rainGeometry = new THREE.BufferGeometry();
const rainPositionAttribute = new THREE.BufferAttribute(rainPositions, 3);
rainPositionAttribute.setUsage(THREE.DynamicDrawUsage);
rainGeometry.setAttribute('position', rainPositionAttribute);
const rainMaterial = new THREE.LineBasicMaterial({
  color: 0xb8d4e2,
  transparent: true,
  opacity: 0,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const rain = new THREE.LineSegments(rainGeometry, rainMaterial);
rain.frustumCulled = false;
rain.renderOrder = 9;
scene.add(rain);

function resetRainDrop(d, initial) {
  d.x = (Math.random() - 0.5) * (CUBE.w - 0.4);
  d.z = (Math.random() - 0.5) * (CUBE.d - 0.4);
  d.y = initial
    ? lerp(CUBE.waterline + 0.06, CUBE.top - 0.08, Math.random())
    : CUBE.top - 0.08 + Math.random() * 0.35;
  d.speed = 2.1 + Math.random() * 2.5;
  d.len = 0.075 + Math.random() * 0.20;
}
for (let i = 0; i < RAIN_COUNT; i++) resetRainDrop(rainDrops[i], true);

function updateRain(dt, storm) {
  const windX = 0.55 + storm * 1.8;
  const windZ = 0.10 + storm * 0.55;
  const gravity = 0.65 + storm * 1.55;
  for (let i = 0; i < RAIN_COUNT; i++) {
    const d = rainDrops[i];
    d.y -= d.speed * gravity * dt;
    d.x += windX * dt;
    d.z += windZ * dt;
    if (d.y < CUBE.waterline + 0.02) resetRainDrop(d, false);
    if (d.x > CUBE.w / 2 - 0.12) d.x = -CUBE.w / 2 + 0.12;
    if (d.z > CUBE.d / 2 - 0.12) d.z = -CUBE.d / 2 + 0.12;
    const j = i * 6;
    const len = d.len * (0.8 + storm * 0.7);
    rainPositions[j] = d.x;
    rainPositions[j + 1] = d.y;
    rainPositions[j + 2] = d.z;
    rainPositions[j + 3] = d.x - windX * 0.015;
    rainPositions[j + 4] = d.y - len;
    rainPositions[j + 5] = d.z - windZ * 0.015;
  }
  rainPositionAttribute.needsUpdate = true;
  rainMaterial.opacity = smoothstep(0.16, 0.92, storm) * 0.34;
  rain.visible = rainMaterial.opacity > 0.005;
}

const boltMaterial = new THREE.LineBasicMaterial({
  color: 0xd9ebff,
  transparent: true,
  opacity: 0,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const boltGeometry = new THREE.BufferGeometry();
const bolt = new THREE.LineSegments(boltGeometry, boltMaterial);
bolt.frustumCulled = false;
bolt.visible = false;
bolt.renderOrder = 10;
scene.add(bolt);

function strikeLightning() {
  const positions = [];
  const startX = (Math.random() - 0.5) * 4.6;
  const startZ = (Math.random() - 0.5) * 4.6;
  const topY = CUBE.top - 0.05;
  const bottomY = CUBE.waterline + 0.06;
  const steps = 12;
  let px = startX;
  let pz = startZ;
  const path = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const y = lerp(topY, bottomY, t);
    if (i > 0) {
      px += (Math.random() - 0.5) * 0.36;
      pz += (Math.random() - 0.5) * 0.36;
    }
    px = clamp(px, -CUBE.w / 2 + 0.2, CUBE.w / 2 - 0.2);
    pz = clamp(pz, -CUBE.d / 2 + 0.2, CUBE.d / 2 - 0.2);
    path.push(new THREE.Vector3(px, y, pz));
  }
  for (let i = 0; i < path.length - 1; i++) {
    const a = path[i];
    const b = path[i + 1];
    positions.push(a.x, a.y, a.z, b.x, b.y, b.z);
  }
  const branchCount = 3;
  for (let b = 0; b < branchCount; b++) {
    let idx = 2 + Math.floor(Math.random() * (path.length - 4));
    const origin = path[idx];
    let bx = origin.x;
    let bz = origin.z;
    let by = origin.y;
    const dirX = (Math.random() - 0.5) * 1.3;
    const dirZ = (Math.random() - 0.5) * 1.3;
    for (let s = 0; s < 4; s++) {
      const nx = clamp(bx + dirX * (0.11 + Math.random() * 0.08), -CUBE.w / 2 + 0.2, CUBE.w / 2 - 0.2);
      const nz = clamp(bz + dirZ * (0.11 + Math.random() * 0.08), -CUBE.d / 2 + 0.2, CUBE.d / 2 - 0.2);
      const ny = by - (0.12 + Math.random() * 0.13);
      positions.push(bx, by, bz, nx, ny, nz);
      bx = nx; by = ny; bz = nz;
    }
  }
  boltGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  bolt.visible = true;
  lightningFlash = 1.0;
  flashLight.position.set(startX, CUBE.waterline + 1.3, startZ);
  nextLightning = elapsed + lerp(16.0, 4.0, weather) * (0.62 + Math.random() * 0.72);
}

function updateLightning(dt) {
  lightningFlash *= Math.exp(-dt * 5.2);
  if (lightningFlash < 0.002) lightningFlash = 0;
  if (weather > 0.54 && elapsed > nextLightning) {
    strikeLightning();
  } else if (weather <= 0.54 && nextLightning < elapsed + 4.0) {
    nextLightning = elapsed + 4.0;
  }
  boltMaterial.opacity = lightningFlash * 0.92;
  bolt.visible = lightningFlash > 0.012;
  flashLight.intensity = lightningFlash * 190;
}

/* --------------------------------------------------------------------------
   Camera states and interaction
   -------------------------------------------------------------------------- */

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function beginCameraMove(toPos, toTarget, duration, nextView) {
  transition = {
    fromPos: camera.position.clone(),
    toPos: toPos.clone(),
    fromTarget: controls.target.clone(),
    toTarget: toTarget.clone(),
    startTime: performance.now(),
    duration,
    nextView
  };
  controls.enabled = false;
}

function setHint(text, linger = 7000) {
  hint.innerHTML = '<span class="dot"></span>' + text;
  hint.classList.remove('dim');
  window.clearTimeout(setHint._timer);
  setHint._timer = window.setTimeout(() => hint.classList.add('dim'), linger);
}

function dismissHint() {
  if (hintDismissed) return;
  hintDismissed = true;
  hint.classList.add('dim');
}

function diveToWhale() {
  if (transition || currentView === 'underwater') return;
  currentView = 'underwater';
  document.body.classList.add('diving');
  const target = whale.position.clone();
  target.y += 0.12;
  const offset = new THREE.Vector3(9.0, 1.30, 9.0);
  if (window.innerWidth / Math.max(window.innerHeight, 1) < 0.95) offset.multiplyScalar(1.18);
  beginCameraMove(target.clone().add(offset), target, 2.7, 'underwater');
  setHint('Drag to explore &middot; reset to surface', 8000);
}

function resetView() {
  if (transition && transition.nextView === 'surface') return;
  currentView = 'surface';
  document.body.classList.remove('diving');
  beginCameraMove(homePos, homeTarget, 2.2, 'surface');
  setHint('Click the whale to dive', 7000);
}

resetButton.addEventListener('click', () => {
  dismissHint();
  resetView();
});

weatherInput.addEventListener('input', (e) => {
  targetWeather = parseFloat(e.target.value);
  document.documentElement.style.setProperty('--weather', targetWeather.toFixed(3));
  dismissHint();
});
weatherInput.addEventListener('pointerdown', dismissHint);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let pointerDown = null;
let pointerMoved = false;
let hoverWhale = false;

function updatePointer(e) {
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}

function whaleUnderPointer() {
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(whale, true);
  return hits.length > 0;
}

canvas.addEventListener('pointerdown', (e) => {
  pointerDown = { x: e.clientX, y: e.clientY };
  pointerMoved = false;
  dismissHint();
});
canvas.addEventListener('pointermove', (e) => {
  updatePointer(e);
  if (pointerDown && Math.hypot(e.clientX - pointerDown.x, e.clientY - pointerDown.y) > 5) {
    pointerMoved = true;
  }
  const nextHover = whaleUnderPointer();
  if (nextHover !== hoverWhale) {
    hoverWhale = nextHover;
    canvas.style.cursor = hoverWhale ? 'pointer' : 'grab';
  }
});
canvas.addEventListener('pointerup', (e) => {
  updatePointer(e);
  if (!pointerMoved && !transition && whaleUnderPointer()) {
    diveToWhale();
  }
  pointerDown = null;
});
canvas.addEventListener('pointerleave', () => {
  pointerDown = null;
  hoverWhale = false;
  canvas.style.cursor = 'grab';
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') resetView();
});

/* --------------------------------------------------------------------------
   Weather interpolation
   -------------------------------------------------------------------------- */

const tmpColor = new THREE.Color();
const rainCalmColor = new THREE.Color(0xcfe7ef);
const rainStormColor = new THREE.Color(0x92b7c9);
const waterlineMaterial = waterline.material;
const whaleDeep = new THREE.Color();
const whaleLight = new THREE.Color();
const fishColor = new THREE.Color();
const fishEmissive = new THREE.Color();

function updateWeather(dt) {
  weather = damp(weather, targetWeather, 1.55, dt);
  const w = weather;
  const ease = smoothstep(0, 1, w);
  const flash = lightningFlash;

  weatherState.waveAmp = lerp(0.32, 1.02, ease);
  weatherState.waveSpeed = lerp(0.66, 1.34, w);
  weatherState.rain = smoothstep(0.16, 0.94, w);
  weatherState.foam = lerp(0.10, 0.92, ease);
  weatherState.sun = lerp(1.10, 0.050, smoothstep(0.05, 0.82, w));
  weatherState.flash = flash;

  const calm = PALETTE.calm;
  const storm = PALETTE.storm;

  waterUniforms.uTime.value = elapsed;
  waterUniforms.uStorm.value = w;
  waterUniforms.uAmpScale.value = weatherState.waveAmp;
  waterUniforms.uSpeedScale.value = weatherState.waveSpeed;
  waterUniforms.uChop.value = lerp(0.54, 0.82, ease);
  waterUniforms.uFoam.value = weatherState.foam;
  waterUniforms.uRain.value = weatherState.rain;
  waterUniforms.uDetail.value = lerp(0.20, 0.38, ease);
  waterUniforms.uFlash.value = flash;
  waterUniforms.uDeep.value.lerpColors(calm.waterDeep, storm.waterDeep, ease);
  waterUniforms.uShallow.value.lerpColors(calm.waterShallow, storm.waterShallow, ease);
  waterUniforms.uFoamColor.value.lerpColors(calm.foam, storm.foam, ease);
  waterUniforms.uSkyHorizon.value.lerpColors(calm.skyHorizon, storm.skyHorizon, ease).multiplyScalar(0.30);
  waterUniforms.uSkyZenith.value.lerpColors(calm.skyTop, storm.skyTop, ease).multiplyScalar(0.48);
  waterUniforms.uSunColor.value.lerpColors(calm.sun, storm.sun, ease);
  waterUniforms.uBeamColor.value.lerpColors(calm.beam, storm.beam, ease);
  waterUniforms.uSunIntensity.value = weatherState.sun;

  skyUniforms.uTime.value = elapsed;
  skyUniforms.uTop.value.lerpColors(calm.skyTop, storm.skyTop, ease);
  skyUniforms.uHorizon.value.lerpColors(calm.skyHorizon, storm.skyHorizon, ease);
  skyUniforms.uCloud.value.lerpColors(calm.cloud, storm.cloud, ease);
  skyUniforms.uSun.value.lerpColors(calm.sun, storm.sun, ease);
  skyUniforms.uSunIntensity.value = weatherState.sun;
  skyUniforms.uCloudiness.value = lerp(0.68, 0.99, ease);
  skyUniforms.uFlash.value = flash;

  glassUniforms.uTint.value.lerpColors(calm.glass, storm.glass, ease);
  glassUniforms.uTime.value = elapsed;
  glassUniforms.uFlash.value = flash;
  edgeMaterial.color.lerpColors(calm.edge, storm.edge, ease);
  edgeMaterial.opacity = 0.50 + (1 - ease) * 0.18 + flash * 0.25;
  waterlineMaterial.color.lerpColors(calm.edge, storm.edge, ease);
  waterlineMaterial.opacity = 0.40 + (1 - ease) * 0.16 + flash * 0.22;

  volumeUniforms.uTime.value = elapsed;
  volumeUniforms.uTop.value.lerpColors(calm.waterVolumeTop, storm.waterVolumeTop, ease);
  volumeUniforms.uDeep.value.lerpColors(calm.waterVolumeDeep, storm.waterVolumeDeep, ease);
  volumeUniforms.uBeam.value.lerpColors(calm.beam, storm.beam, ease);
  volumeUniforms.uFlash.value = flash;

  const beamIntensity = lerp(1.0, 0.54, ease) + flash * 2.6;
  for (const u of beamUniformsList) {
    u.uColor.value.lerpColors(calm.beam, storm.beam, ease);
    u.uTime.value = elapsed;
    u.uOpacity.value = (0.026 + (1 - ease) * 0.016 + flash * 0.09);
  }
  causticUniforms.uTime.value = elapsed;
  causticUniforms.uColor.value.lerpColors(calm.beam, storm.beam, ease);
  causticUniforms.uOpacity.value = lerp(0.065, 0.035, ease) + flash * 0.075;
  causticUniforms.uFlash.value = flash;

  particleUniforms.uTime.value = elapsed;
  particleUniforms.uOpacity.value = lerp(0.52, 0.36, ease);
  particleUniforms.uFlash.value = flash;
  dust.material.uniforms.uTime.value = elapsed;
  dust.material.uniforms.uColor.value.lerpColors(calm.ambient, storm.ambient, ease);

  whaleUniforms.uTime.value = elapsed;
  whaleUniforms.uFlash.value = flash;
  whaleUniforms.uDeep.value.lerpColors(calm.waterVolumeDeep, storm.waterVolumeDeep, ease);
  whaleUniforms.uLight.value.lerpColors(calm.beam, storm.beam, ease);
  whaleUniforms.uRim.value.lerpColors(calm.whaleRim, storm.whaleRim, ease);

  fishColor.lerpColors(calm.fish, storm.fish, ease);
  fishEmissive.lerpColors(calm.fishEmissive, storm.fishEmissive, ease);
  fishMaterial.color.copy(fishColor);
  fishMaterial.emissive.copy(fishEmissive);

  ambient.color.lerpColors(calm.ambient, storm.ambient, ease);
  ambient.intensity = lerp(1.05, 0.46, ease) + flash * 0.5;
  keyLight.color.lerpColors(calm.sun, storm.sun, ease);
  keyLight.intensity = lerp(2.35, 0.58, ease) + flash * 0.55;
  rimLight.color.lerpColors(calm.ambient, storm.ambient, ease);
  rimLight.intensity = lerp(1.40, 0.78, ease);
  underLight.color.lerpColors(calm.underLight, storm.underLight, ease);
  underLight.intensity = lerp(34, 26, ease) + flash * 110;
  underLight2.color.lerpColors(calm.underLight2, storm.underLight2, ease);
  underLight2.intensity = lerp(25, 20, ease) + flash * 90;
  flashLight.color.set(0xcfe4ff);

  floorPool.material.color.lerpColors(calm.floorGlow, storm.floorGlow, ease);
  floorPool.material.opacity = lerp(0.15, 0.10, ease) + flash * 0.09;
  contactShadow.material.opacity = lerp(0.72, 0.84, ease);

  backdropUniforms.uTop.value.lerpColors(calm.skyTop, storm.skyTop, ease).multiplyScalar(0.10);
  backdropUniforms.uBottom.value.set(0x010203);
  backdropUniforms.uGlow.value.lerpColors(calm.floorGlow, storm.floorGlow, ease);
  backdropUniforms.uGlowStrength.value = lerp(0.17, 0.12, ease) + flash * 0.22;

  rainMaterial.color.lerpColors(rainCalmColor, rainStormColor, ease);
  bloom.strength = 0.44 + ease * 0.12 + flash * 0.42;
  bloom.radius = 0.66 + flash * 0.18;
  bloom.threshold = 0.82 - flash * 0.12;
  renderer.toneMappingExposure = 1.05 - ease * 0.10 + flash * 0.16;
}

/* --------------------------------------------------------------------------
   Animation loop
   -------------------------------------------------------------------------- */

function updateCameraTransition(now) {
  if (!transition) return;
  const raw = clamp((now - transition.startTime) / (transition.duration * 1000), 0, 1);
  const e = easeInOutCubic(raw);
  camera.position.lerpVectors(transition.fromPos, transition.toPos, e);
  controls.target.lerpVectors(transition.fromTarget, transition.toTarget, e);
  camera.lookAt(controls.target);
  if (raw >= 1) {
    transition = null;
    controls.enabled = true;
    controls.update();
    if (currentView === 'underwater') setHint('Drag to explore &middot; reset to surface', 7000);
  }
}

let firstFrame = true;
function animate(now) {
  const rawDt = (now - lastFrame) / 1000;
  lastFrame = now;
  const dt = clamp(rawDt || 0.016, 0.001, 0.05);
  elapsed += dt;

  updateLightning(dt);
  updateWeather(dt);
  updateShip(elapsed, weatherState.waveAmp, weatherState.waveSpeed, weather);
  updateWhale(elapsed);
  updateFish(elapsed);
  updateRain(dt, weather);
  updateCameraTransition(now);

  if (!transition) controls.update();
  composer.render();

  if (firstFrame) {
    firstFrame = false;
    setTimeout(() => {
      document.body.classList.add('ready');
      loader.classList.add('hidden');
    }, 180);
  }
}
renderer.setAnimationLoop(animate);

function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  refreshCameraHomes();
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.resolution.set(w, h);
  const resizeDPR = Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 1.5 : 1.75);
  particleUniforms.uPixelRatio.value = resizeDPR;
  dust.material.uniforms.uPixelRatio.value = resizeDPR;
}
window.addEventListener('resize', onResize);

// Start at a composed, lived-in moment rather than an empty first frame.
document.documentElement.style.setProperty('--weather', targetWeather.toFixed(3));
setTimeout(() => {
  if (!firstFrame) return;
  document.body.classList.add('ready');
  loader.classList.add('hidden');
}, 7000);

</script>
