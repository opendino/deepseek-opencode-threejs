<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#040507" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23040608'/%3E%3Cpath d='M6 18h20M7 21c3-2 5 2 9 0s6 2 9 0M9 24c3-2 5 2 9 0s5 2 8 0' stroke='%23a9d8d6' fill='none'/%3E%3C/svg%3E">
<title>A Sea, Held</title>
<style>
  :root{
    --paper:#e9e4d8;
    --muted:rgba(233,228,216,.43);
    --hair:rgba(233,228,216,.16);
    --accent:#ffb17d;
    --fill:44%;
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;background:#030406;color:var(--paper);overflow:hidden}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    cursor:default;
  }
  body.underwater{--accent:#9dd6dc;--muted:rgba(200,230,231,.46);--hair:rgba(190,225,226,.16)}
  #stage{position:fixed;inset:0;z-index:1}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none;filter:saturate(1.07) contrast(1.018)}

  .ui{position:fixed;z-index:12;pointer-events:none}
  .masthead{top:clamp(24px,4.4vw,58px);left:clamp(24px,4.4vw,62px);max-width:280px}
  .kicker{
    display:flex;align-items:center;gap:12px;
    margin-bottom:15px;font-size:8px;line-height:1;letter-spacing:.34em;
    color:var(--muted);text-transform:uppercase;
  }
  .kicker:before{content:"";width:27px;height:1px;background:var(--accent);opacity:.82;transition:background .8s}
  h1{
    margin:0;font-family:"Bodoni 72","Didot",Georgia,"Times New Roman",serif;
    font-weight:400;font-size:clamp(27px,3.25vw,49px);line-height:.94;
    letter-spacing:.018em;text-shadow:0 2px 30px rgba(0,0,0,.55);
  }
  h1 em{font-style:italic;color:#f7c9a2}
  .sub{
    margin:15px 0 0 38px;max-width:218px;
    font-family:Georgia,"Times New Roman",serif;font-size:11px;font-style:italic;
    line-height:1.58;color:var(--muted);
  }

  .reset{
    pointer-events:auto;position:fixed;z-index:14;
    top:clamp(24px,4.4vw,50px);right:clamp(24px,4.4vw,56px);
    width:40px;height:40px;border-radius:50%;
    border:1px solid var(--hair);background:rgba(7,9,11,.24);
    color:rgba(233,228,216,.7);display:grid;place-items:center;cursor:pointer;
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    transition:border-color .35s,color .35s,transform .55s,background .35s;
  }
  .reset:hover{border-color:color-mix(in srgb,var(--accent) 64%,transparent);color:#ffe4ca;transform:rotate(-28deg);background:rgba(22,18,15,.38)}
  .reset:focus-visible,.weather input:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
  .reset svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}

  .weather{
    left:50%;bottom:clamp(24px,4.2vw,40px);transform:translateX(-50%);
    width:min(78vw,390px);pointer-events:auto;
    padding:14px 18px 12px;
    background:linear-gradient(180deg,rgba(9,11,13,.22),rgba(6,8,10,.5));
    border:1px solid var(--hair);
    backdrop-filter:blur(16px) saturate(.82);-webkit-backdrop-filter:blur(16px) saturate(.82);
    box-shadow:0 20px 60px rgba(0,0,0,.24);
    transition:border-color .8s,background .8s;
  }
  .weather:hover{border-color:rgba(233,228,216,.25)}
  .w-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:12px}
  .w-label{font-size:8px;letter-spacing:.31em;color:var(--muted);text-transform:uppercase}
  #condition{
    font-family:Georgia,"Times New Roman",serif;font-style:italic;
    font-size:10px;letter-spacing:.08em;color:var(--accent);
    transition:color .8s;white-space:nowrap;
  }
  .range-wrap{height:18px;display:flex;align-items:center}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:24px;margin:0;
    background:transparent;cursor:ew-resize;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:1px;border:0;
    background:linear-gradient(90deg,var(--accent) 0 var(--fill),rgba(233,228,216,.2) var(--fill) 100%);
  }
  input[type=range]::-moz-range-track{height:1px;background:rgba(233,228,216,.2)}
  input[type=range]::-moz-range-progress{height:1px;background:var(--accent)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:11px;height:11px;border-radius:50%;
    margin-top:-5px;background:#faeadb;border:1px solid rgba(255,255,255,.82);
    box-shadow:0 0 0 4px rgba(255,177,125,.1),0 0 20px rgba(255,171,113,.72);
    transition:box-shadow .4s;
  }
  input[type=range]::-moz-range-thumb{
    width:9px;height:9px;border-radius:50%;background:#faeadb;border:1px solid #fff;
    box-shadow:0 0 0 4px rgba(255,177,125,.1),0 0 20px rgba(255,171,113,.72);
  }
  .w-scale{display:flex;justify-content:space-between;margin-top:3px}
  .w-scale span{font-size:7px;letter-spacing:.25em;color:rgba(233,228,216,.27);text-transform:uppercase}

  .hint{
    right:clamp(24px,4.4vw,56px);bottom:clamp(29px,4.4vw,45px);
    display:flex;align-items:center;gap:11px;
    font-size:8px;letter-spacing:.21em;color:var(--muted);text-transform:uppercase;
    transition:opacity .7s,transform .7s;
  }
  .hint:after{content:"";width:32px;height:1px;background:var(--hair)}
  .hint.hide{opacity:0;transform:translateY(5px)}

  .vignette{
    position:fixed;inset:0;z-index:5;pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 47%,transparent 27%,rgba(1,2,4,.24) 67%,rgba(1,2,4,.79) 112%),
      linear-gradient(180deg,rgba(0,0,0,.2),transparent 22%,transparent 74%,rgba(0,0,0,.36));
    transition:background 1.2s;
  }
  body.underwater .vignette{
    background:
      radial-gradient(ellipse at 50% 52%,transparent 19%,rgba(1,13,20,.23) 64%,rgba(0,5,10,.8) 113%),
      linear-gradient(180deg,rgba(16,57,68,.1),transparent 31%,transparent 68%,rgba(0,5,10,.4));
  }
  .grain{
    position:fixed;inset:-22%;z-index:6;pointer-events:none;opacity:.032;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");
    animation:grain 1.2s steps(3) infinite;
  }
  @keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-1.4%,1.1%)}66%{transform:translate(1.2%,-1.2%)}100%{transform:translate(0,0)}}

  #flash{
    position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at 50% 25%,rgba(220,238,255,.65),rgba(145,185,225,.12) 42%,transparent 72%);
    mix-blend-mode:screen;
  }

  .curtain{
    position:fixed;inset:0;z-index:50;background:#040507;
    display:grid;place-items:center;transition:opacity 1.6s ease,visibility 1.6s;
  }
  .curtain.done{opacity:0;visibility:hidden}
  .curtain-in{text-align:center}
  .c-line{width:1px;height:42px;margin:0 auto 18px;background:linear-gradient(180deg,transparent,#c99c7c)}
  .c-text{font-size:8px;letter-spacing:.42em;color:rgba(233,228,216,.4);text-transform:uppercase}

  .err{
    position:fixed;inset:0;z-index:60;display:none;place-items:center;background:#070809;
    font-family:Georgia,serif;font-style:italic;color:#d9c9b9;text-align:center;padding:30px;line-height:1.6;
  }

  @media (max-width:700px){
    .sub{display:none}
    .masthead{max-width:220px;top:22px;left:22px}
    .kicker{margin-bottom:10px;letter-spacing:.26em}
    .weather{width:calc(100vw - 40px);bottom:20px;padding:12px 15px 10px}
    .hint{display:none}
    .reset{top:20px;right:20px}
    .grain{opacity:.025}
  }
  @media (max-height:580px){
    .sub{display:none}
    .masthead{top:18px}
    .weather{bottom:14px;padding:9px 15px 8px}
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div id="flash"></div>

  <header class="ui masthead">
    <div class="kicker">Kinetic study &middot; no. 09</div>
    <h1>A Sea, <em>Held</em></h1>
    <p class="sub">A living ocean, nine metres of weather, and one small red vessel.</p>
  </header>

  <button class="reset" id="reset" aria-label="Reset view" title="Reset view">
    <svg viewBox="0 0 24 24"><path d="M20 9a8 8 0 1 0 .4 5.2M20 4v5h-5"/></svg>
  </button>

  <section class="weather ui" aria-label="Weather">
    <div class="w-head">
      <span class="w-label">Weather</span>
      <span id="condition">Swell</span>
    </div>
    <div class="range-wrap">
      <input id="weather" type="range" min="0" max="1000" value="530" aria-label="Weather, from sunrise calm to midnight storm" />
    </div>
    <div class="w-scale"><span>Sunrise</span><span>Midnight storm</span></div>
  </section>

  <div class="hint ui" id="hint">Click the whale to descend</div>

  <div class="curtain" id="curtain">
    <div class="curtain-in"><div class="c-line"></div><div class="c-text">Condensing</div></div>
  </div>
  <div class="err" id="err">This study needs WebGL.<br>Please open it in a current browser.</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

  const clamp = THREE.MathUtils.clamp;
  const lerp = THREE.MathUtils.lerp;
  const smooth01 = (x)=>{ x=clamp(x,0,1); return x*x*(3-2*x); };

  // deterministic, so the opening frame has a composition rather than an accident
  let seed = 731927;
  const rand = (a=0,b=1)=>{
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return a + ((t ^ t >>> 14) >>> 0) / 4294967296 * (b-a);
  };

  const SIZE = 9.2;
  const HALF = SIZE * .5;
  const CUBE_Y = 4.4;
  const BOTTOM = CUBE_Y - HALF;
  const TOP = CUBE_Y + HALF;
  const WATER_Y = 6.18;
  const FLOOR_Y = -1.58;
  const HOME_POS = new THREE.Vector3(13.0, 10.7, 18.9);
  const HOME_TARGET = new THREE.Vector3(0, 4.22, 0);

  let renderer, scene, camera, controls, composer, bloom, clock;
  let ready = false, elapsed = 0;
  let weather = .53, weatherTarget = .53, waveGain = .68;
  let underwater = false, cameraAnim = null;
  let ocean, whale, ship, glassMat, waterUniforms, beams, particles, airMotes;
  let rain, rainData, rainPositions;
  let whaleHit = [], whaleHover = false, whaleRimMat;
  let lightningGroup, lightningMat, flashLevel = 0, nextStrike = 6.5;
  let shipY = WATER_Y + .2, shipPitch = 0, shipRoll = 0;
  let spray, sprayData, sprayPositions;
  let interiorFade = 0;
  let raycaster, pointerNDC;
  let reflectionRT, reflectionCamera;
  const reflectionMatrix = new THREE.Matrix4();
  let conditionText = 'Swell';
  let lastWeatherText = '';
  let hoveredPointer = false;

  const slider = document.querySelector('#weather');
  const conditionEl = document.querySelector('#condition');
  const hint = document.querySelector('#hint');
  const flashEl = document.querySelector('#flash');
  const canvasHost = document.querySelector('#stage');

  const conditionNames = ['Sunrise','Clear light','Swell','Squall','Midnight'];
  const conditionFor = (w)=> w < .13 ? conditionNames[0] : w < .35 ? conditionNames[1] : w < .58 ? conditionNames[2] : w < .82 ? conditionNames[3] : conditionNames[4];

  const DAWN = {
    fog:new THREE.Color('#050608'), domeTop:new THREE.Color('#000000'), domeHorizon:new THREE.Color('#050303'),
    glow:new THREE.Color('#ff9d63'), glow2:new THREE.Color('#ff6f43'), sun:new THREE.Color('#ffd1a6'),
    skyTop:new THREE.Color('#8caec0'), skyHorizon:new THREE.Color('#ffa27b'),
    deep:new THREE.Color('#042234'), shallow:new THREE.Color('#0a6676'), seaGlow:new THREE.Color('#31a7a7'),
    foam:new THREE.Color('#ffe2cc'), underDeep:new THREE.Color('#01131d'), underMid:new THREE.Color('#063a47'),
    underLight:new THREE.Color('#2c9ba0'), beam:new THREE.Color('#ffd1a2'), glass:new THREE.Color('#bde0da'),
    floor:new THREE.Color('#8c6b58'), fill:new THREE.Color('#ff9b66'), key:new THREE.Color('#ffb27b'),
    rim:new THREE.Color('#77c5cf')
  };
  const STORM = {
    fog:new THREE.Color('#010205'), domeTop:new THREE.Color('#000000'), domeHorizon:new THREE.Color('#010306'),
    glow:new THREE.Color('#5c7e9e'), glow2:new THREE.Color('#263e5e'), sun:new THREE.Color('#c5d9ef'),
    skyTop:new THREE.Color('#405673'), skyHorizon:new THREE.Color('#152538'),
    deep:new THREE.Color('#00101a'), shallow:new THREE.Color('#073a4a'), seaGlow:new THREE.Color('#1c6e79'),
    foam:new THREE.Color('#dce9eb'), underDeep:new THREE.Color('#00060a'), underMid:new THREE.Color('#021923'),
    underLight:new THREE.Color('#1b5d6e'), beam:new THREE.Color('#7bb4c5'), glass:new THREE.Color('#9abecb'),
    floor:new THREE.Color('#435b68'), fill:new THREE.Color('#7896ae'), key:new THREE.Color('#b7d0ec'),
    rim:new THREE.Color('#517a9e')
  };
  const mixC = (target,a,b,t)=>{ target.copy(a).lerp(b,t); return target; };

  // Six overlapping swells. Amplitudes are in metres before the weather gain.
  const WAVES = [
    {dx: .94, dz: .34, amp:.150, len:5.8, speed:.31, phase:.2,  steep:.58},
    {dx:-.42, dz: .91, amp:.092, len:3.65,speed:.41, phase:2.1, steep:.50},
    {dx: .69, dz:-.72, amp:.058, len:2.25,speed:.53, phase:4.4, steep:.42},
    {dx:-.89, dz:-.28, amp:.035, len:1.42,speed:.63, phase:1.5, steep:.32},
    {dx: .18, dz: .98, amp:.022, len: .88,speed:.74, phase:3.2, steep:.22},
    {dx:-.67, dz: .55, amp:.011, len: .54,speed:.86, phase:5.4, steep:.14}
  ].map(w=>{
    const l=Math.hypot(w.dx,w.dz); w.dx/=l; w.dz/=l;
    w.k=Math.PI*2/w.len; w.omega=Math.sqrt(9.81*w.k)*w.speed;
    return w;
  });

  function waveHeight(x,z,t,gain){
    let h=0;
    for(const w of WAVES){
      const ph = (w.dx*x + w.dz*z)*w.k - t*w.omega + w.phase;
      h += w.amp*gain*Math.sin(ph);
    }
    h += Math.sin(x*13.7+t*1.35)*Math.sin(z*11.2-t*1.1)*.006*gain;
    return h;
  }

  function glslWaves(){
    return WAVES.map((w,i)=>{
      const dx=w.dx.toFixed(6), dz=w.dz.toFixed(6), k=w.k.toFixed(6);
      const amp=w.amp.toFixed(6), om=w.omega.toFixed(6), ph=w.phase.toFixed(6), st=w.steep.toFixed(3);
      return `
        { float p${i}=dot(vec2(${dx},${dz}),p)*${k}-uTime*${om}+${ph};
          float s${i}=sin(p${i}); float c${i}=cos(p${i});
          float a${i}=${amp}*uWaveGain;
          h+=a${i}*s${i};
          dhx+=${dx}*a${i}*${k}*c${i};
          dhz+=${dz}*a${i}*${k}*c${i};
          displaced.x+=${dx}*a${i}*${st}*.52*c${i};
          displaced.z+=${dz}*a${i}*${st}*.52*c${i};
          chop+=a${i}*${k}*abs(c${i}); }`;
    }).join('\n');
  }

  function init(){
    try{
      renderer = new THREE.WebGLRenderer({antialias:true, alpha:false, powerPreference:'high-performance'});
    }catch(e){
      document.querySelector('#err').style.display='grid'; return;
    }
    renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
    renderer.setSize(innerWidth,innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;
    canvasHost.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    scene.background = new THREE.Color('#030406');
    scene.fog = new THREE.FogExp2('#08080b', .013);

    camera = new THREE.PerspectiveCamera(innerWidth/innerHeight<.85?56:36, innerWidth/innerHeight, .06, 90);
    camera.position.copy(HOME_POS);

    raycaster = new THREE.Raycaster();
    pointerNDC = new THREE.Vector2();

    controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(HOME_TARGET);
    controls.enableDamping = true;
    controls.dampingFactor = .05;
    controls.enablePan = false;
    controls.minDistance = 7.3;
    controls.maxDistance = 25;
    controls.minPolarAngle = .22;
    controls.maxPolarAngle = 1.5;
    controls.rotateSpeed = .48;
    controls.zoomSpeed = .65;
    controls.update();

    composer = new EffectComposer(renderer);
    composer.setPixelRatio(Math.min(devicePixelRatio,1.75));
    composer.setSize(innerWidth,innerHeight);
    composer.addPass(new RenderPass(scene,camera));
    bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), .55, .72, .68);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    clock = new THREE.Clock();

    buildEnvironment();
    buildLights();
    buildGallery();
    buildCube();
    buildUnderwaterVolume();
    buildSeabed();
    buildOcean();
    buildShafts();
    buildParticles();
    buildFish();
    buildWhale();
    buildShip();
    buildRain();
    buildLightning();
    buildAirMotes();
    bindEvents();
    updateWeather(0);
    refreshWeatherPalette(weather);

    requestAnimationFrame(()=>{
      ready = true;
      setTimeout(()=>document.querySelector('#curtain').classList.add('done'), 300);
    });
    animate();
  }

  function buildEnvironment(){
    // A tiny procedural equirectangular studio environment for the physical materials.
    const c=document.createElement('canvas'); c.width=1024; c.height=512;
    const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,0,512);
    g.addColorStop(0,'#010204'); g.addColorStop(.38,'#080b11');
    g.addColorStop(.52,'#2a1b15'); g.addColorStop(.62,'#0b1118'); g.addColorStop(1,'#020305');
    x.fillStyle=g; x.fillRect(0,0,1024,512);
    const warm=x.createRadialGradient(245,252,2,245,252,210);
    warm.addColorStop(0,'rgba(255,186,128,.86)');
    warm.addColorStop(.25,'rgba(206,105,66,.24)');
    warm.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=warm; x.fillRect(0,0,1024,512);
    const cool=x.createRadialGradient(770,190,2,770,190,260);
    cool.addColorStop(0,'rgba(105,178,194,.36)');
    cool.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=cool; x.fillRect(0,0,1024,512);
    const tex=new THREE.CanvasTexture(c);
    tex.mapping=THREE.EquirectangularReflectionMapping;
    tex.colorSpace=THREE.SRGBColorSpace;
    const pmrem=new THREE.PMREMGenerator(renderer);
    scene.environment=pmrem.fromEquirectangular(tex).texture;
    scene.environmentIntensity=.52;
    tex.dispose(); pmrem.dispose();
  }

  function buildLights(){
    const hemi=new THREE.HemisphereLight('#ffd4b4','#071722',.68);
    scene.add(hemi); scene.userData.hemi=hemi;

    const key=new THREE.DirectionalLight('#ffb27b',2.35);
    key.position.set(-8,12,9); scene.add(key); scene.userData.key=key;

    const rim=new THREE.DirectionalLight('#75c7d2',1.0);
    rim.position.set(8,6,-9); scene.add(rim); scene.userData.rim=rim;

    const top=new THREE.SpotLight('#ffd0ab',120,36,.52,.82,1.45);
    top.position.set(2.5,17,6); top.target.position.set(0,3.6,0);
    scene.add(top); scene.add(top.target); scene.userData.top=top;

    const underA=new THREE.PointLight('#35c1cb',20,12,1.8);
    underA.position.set(.8,4.4,-2.2); scene.add(underA); scene.userData.underA=underA;

    const underB=new THREE.PointLight('#175b73',16,10,1.9);
    underB.position.set(-2.4,2.4,1.2); scene.add(underB); scene.userData.underB=underB;

    const whaleLight=new THREE.PointLight('#69ced2',22,9,1.8);
    whaleLight.position.set(2.6,3.4,3.2); scene.add(whaleLight); scene.userData.whaleLight=whaleLight;

    const warm=new THREE.PointLight('#ff8b53',28,17,1.8);
    warm.position.set(-5.5,6.8,-4.8); scene.add(warm); scene.userData.warm=warm;

    const floorFill=new THREE.PointLight('#e0ad8a',55,22,1.8);
    floorFill.position.set(1.5,1.5,6.5); scene.add(floorFill); scene.userData.floorFill=floorFill;

    const flash=new THREE.PointLight('#d6e9ff',0,28,1.7);

  function buildGallery(){
    const dome=new THREE.Mesh(new THREE.SphereGeometry(52,48,24), new THREE.ShaderMaterial({
      side:THREE.BackSide, depthWrite:false, fog:false,
      uniforms:{
        uTop:{value:DAWN.domeTop.clone()},uHorizon:{value:DAWN.domeHorizon.clone()},
        uGlow:{value:DAWN.glow.clone()},uGlow2:{value:DAWN.glow2.clone()},
        uStorm:{value:weather},uFlash:{value:0},uTime:{value:0}
      },
      vertexShader:`varying vec3 vW; void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
      fragmentShader:`
        uniform vec3 uTop,uHorizon,uGlow,uGlow2; uniform float uStorm,uFlash,uTime;
        varying vec3 vW;
        float hash(vec2 p){p=fract(p*vec2(123.34,345.45));p+=dot(p,p+34.345);return fract(p.x*p.y);}
        float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
          return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
        float fbm(vec2 p){float v=0.,a=.55;for(int i=0;i<4;i++){v+=a*noise(p);p=p*2.03+9.2;a*=.5;}return v;}
        void main(){
          vec3 d=normalize(vW);
          float h=smoothstep(-.24,.85,d.y);
          vec3 c=mix(uHorizon,uTop,h);
          vec3 gd=normalize(vec3(-.58,.22,-.8));
          float glow=pow(max(dot(d,gd),0.),7.);

          c+=uGlow*glow*.16+uGlow2*halo*.09;
          float band=fbm(d.xz*2.0+d.y*1.4+vec2(uTime*.002,0.));
          c*= .52+band*.15;
          c+=uGlow*pow(max(d.y,0.),4.)*.007;
          c+=uFlash*vec3(.55,.72,.95)*(.45+pow(max(1.-d.y,0.),2.)*.4);
          gl_FragColor=vec4(c,1.);
        }
      `
    }));
    dome.renderOrder=-20; scene.add(dome); scene.userData.dome=dome;

    // A soft gallery wall glow behind the work.
    const halo=new THREE.Mesh(new THREE.PlaneGeometry(72,46),new THREE.ShaderMaterial({
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, fog:false,
      uniforms:{uGlow:{value:DAWN.glow.clone()},uStorm:{value:weather},uFlash:{value:0}},
      vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
      fragmentShader:`
        uniform vec3 uGlow;uniform float uStorm,uFlash;varying vec2 vUv;

    }));
    halo.position.set(0,9.0,-24); halo.renderOrder=-19; scene.add(halo); scene.userData.halo=halo;

    // A polished, dark-stone floor. Its sheen is painted rather than mirrored so the
    // submerged scene stays legible through the glass.
    reflectionRT=new THREE.WebGLRenderTarget(640,640,{type:THREE.HalfFloatType});
    reflectionRT.texture.minFilter=THREE.LinearFilter; reflectionRT.texture.magFilter=THREE.LinearFilter;
    reflectionCamera=new THREE.PerspectiveCamera();
    const floorUniforms={
      uTime:{value:0},uStorm:{value:weather},uWarm:{value:DAWN.glow.clone()},
      uSea:{value:DAWN.underLight.clone()},uFlash:{value:0},
      tReflection:{value:reflectionRT.texture},uReflectMatrix:{value:reflectionMatrix}
    };
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(90,90),new THREE.ShaderMaterial({
      uniforms:floorUniforms,
      vertexShader:`uniform mat4 uReflectMatrix;varying vec3 vW;varying vec2 vUv;varying vec4 vReflect;void main(){vUv=uv;vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;vReflect=uReflectMatrix*w;gl_Position=projectionMatrix*viewMatrix*w;}`,
      fragmentShader:`
        uniform float uTime,uStorm,uFlash;uniform vec3 uWarm,uSea;uniform sampler2D tReflection;varying vec3 vW;varying vec2 vUv;varying vec4 vReflect;
        float hash(vec2 p){p=fract(p*vec2(123.34,345.45));p+=dot(p,p+34.345);return fract(p.x*p.y);}
        float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
          return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
        float fbm(vec2 p){float v=0.,a=.55;for(int i=0;i<4;i++){v+=a*noise(p);p=p*2.03+7.1;a*=.5;}return v;}
        void main(){
          vec2 p=vW.xz;
          float d=length(p*vec2(.76,1.));
          vec3 V=normalize(cameraPosition-vW);
          vec3 N=vec3(0.,1.,0.);
          float fres=pow(1.-max(dot(N,V),0.),3.1);
          float grain=fbm(p*1.6+vec2(2.1,7.7));
          vec3 base=mix(vec3(.0035,.005,.0065),vec3(.016,.019,.022),smoothstep(1.,28.,d));
          base*=.83+.28*grain;
          float inside=smoothstep(7.8,2.6,d);
          float pool=exp(-d*d*.035);
          base+=mix(uSea,uWarm,.42)*pool*.075;
          base+=uSea*inside*.035;
          vec3 L=normalize(vec3(-.42,.28,-.86));
          float spec=pow(max(dot(reflect(-V,N),L),0.),9.)*fres;
          base+=uWarm*spec*.38;
          float streak=pow(.5+.5*sin(p.x*1.5+noise(p*.8)*3.2),12.)*smoothstep(10.,1.,d);
          base+=uSea*streak*.03;
          base+=uFlash*vec3(.06,.1,.14);
          if(vReflect.w>0.0){
            vec2 ro=vec2(.0018);
            vec3 refl=texture2DProj(tReflection,vReflect).rgb*.44;
            refl+=texture2DProj(tReflection,vReflect+vec4(ro.x*vReflect.w,0.,0.,0.)).rgb*.15;
            refl+=texture2DProj(tReflection,vReflect-vec4(ro.x*vReflect.w,0.,0.,0.)).rgb*.15;
            refl+=texture2DProj(tReflection,vReflect+vec4(0.,ro.y*vReflect.w,0.,0.)).rgb*.15;
            refl+=texture2DProj(tReflection,vReflect-vec4(0.,ro.y*vReflect.w,0.,0.)).rgb*.15;
            refl*=1.55;
            float rs=smoothstep(30.,1.2,d)*(.52+.42*fres);
            base=mix(base,refl,mix(vec3(.78,.88,.9),vec3(1.),fres)*rs);
          }
          gl_FragColor=vec4(base,1.);
        }
      `
    }));
    floor.rotation.x=-Math.PI/2; floor.position.y=FLOOR_Y; floor.renderOrder=-9;
    scene.add(floor); scene.userData.floor=floor; scene.userData.floorUniforms=floorUniforms;
    scene.userData.floorMat=floor.material;

    // A very soft, elongated sheen under the cube reads as its reflection on the stone.
    const sheen = new THREE.Mesh(new THREE.PlaneGeometry(17,26),new THREE.ShaderMaterial({
      transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, fog:false,
      uniforms:{
        uWarm:{value:DAWN.glow.clone()}, uSea:{value:DAWN.underLight.clone()},
        uStorm:{value:weather}, uStrength:{value:.6}
      },
      vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
      fragmentShader:`
        uniform vec3 uWarm,uSea;uniform float uStorm,uStrength;varying vec2 vUv;
        float hash(vec2 p){p=fract(p*vec2(123.34,345.45));p+=dot(p,p+34.345);return fract(p.x*p.y);}
        float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
          return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
        void main(){
          vec2 p=vUv-.5;
          float vertical=exp(-p.x*p.x*22.);
          float reach=smoothstep(.49,.02,p.y)*smoothstep(-.5,-.2,p.y);
          float ripple=noise(vec2(p.x*9.,p.y*22.+uStorm*3.))* .5+.5;
          float a=vertical*reach*(.12+ripple*.13)*uStrength*8.;
          vec3 c=mix(uSea,uWarm,.48+.18*sin(p.y*18.));
          gl_FragColor=vec4(c,a);
        }
      `
    }));
    sheen.rotation.x=-Math.PI/2; sheen.position.set(0,FLOOR_Y+.002,-1.2); sheen.renderOrder=-7;
    scene.add(sheen); scene.userData.sheen=sheen;

    // A quiet pool of light on the floor.
    const pool=new THREE.Mesh(new THREE.PlaneGeometry(19,19),new THREE.ShaderMaterial({
      transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false,
      uniforms:{uColor:{value:DAWN.floor.clone()},uStrength:{value:.16}},
      vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
      fragmentShader:`uniform vec3 uColor;uniform float uStrength;varying vec2 vUv;
        void main(){float r=length(vUv-.5)*2.;float a=exp(-r*r*3.6)*uStrength;gl_FragColor=vec4(uColor,a);}`
    }));
    pool.rotation.x=-Math.PI/2; pool.position.y=FLOOR_Y+.004; pool.renderOrder=-7;
    scene.add(pool); scene.userData.pool=pool;

    // Faint contact shadow keeps the cube from looking pasted onto the floor.
    const shadow=new THREE.Mesh(new THREE.PlaneGeometry(15,15),new THREE.ShaderMaterial({
      transparent:true,depthWrite:false,fog:false,
      vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
      fragmentShader:`varying vec2 vUv;void main(){vec2 p=vUv-.5;float r=length(vec2(p.x,p.y*1.2))*2.;
        float a=exp(-r*r*2.8)*.38;gl_FragColor=vec4(.002,.003,.004,a);}`
    }));
    shadow.rotation.x=-Math.PI/2; shadow.position.y=FLOOR_Y+.006; shadow.renderOrder=-6;
    scene.add(shadow); scene.userData.shadow=shadow;

  const metal = new THREE.MeshStandardMaterial({color:'#a3b5b3',metalness:.88,roughness:.22,emissive:'#0d2224',emissiveIntensity:.45});
  const edgeGlow = new THREE.MeshBasicMaterial({color:'#a5d9d6',transparent:true,opacity:.11,blending:THREE.AdditiveBlending,depthWrite:false});

  function edgeBeam(a,b,r,mat){
    const d=new THREE.Vector3().subVectors(b,a), len=d.length();
    const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,8,1,false),mat);
    m.position.copy(a).add(b).multiplyScalar(.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
    return m;
  }

  function buildCube(){
    const edges=[];
    for(const x of [-HALF,HALF]) for(const z of [-HALF,HALF]) edges.push([new THREE.Vector3(x,BOTTOM,z),new THREE.Vector3(x,TOP,z)]);
    for(const y of [BOTTOM,TOP]) for(const z of [-HALF,HALF]) edges.push([new THREE.Vector3(-HALF,y,z),new THREE.Vector3(HALF,y,z)]);
    for(const y of [BOTTOM,TOP]) for(const x of [-HALF,HALF]) edges.push([new THREE.Vector3(x,y,-HALF),new THREE.Vector3(x,y,HALF)]);
    for(const [a,b] of edges){
      scene.add(edgeBeam(a,b,.022,metal));
      const glow=edgeBeam(a,b,.042,edgeGlow); glow.renderOrder=23; scene.add(glow);
    }
    const cornerGeo=new THREE.SphereGeometry(.034,10,8);
    for(const x of [-HALF,HALF]) for(const y of [BOTTOM,TOP]) for(const z of [-HALF,HALF]){
      const m=new THREE.Mesh(cornerGeo,metal); m.position.set(x,y,z); scene.add(m);
    }

    glassMat=new THREE.ShaderMaterial({
      transparent:true,side:THREE.DoubleSide,depthWrite:false,blending:THREE.NormalBlending,
      uniforms:{
        uTime:{value:0},uStorm:{value:weather},uInterior:{value:0},
        uTint:{value:DAWN.glass.clone()},uFlash:{value:0},uWaterY:{value:WATER_Y}
      },
      vertexShader:`
        varying vec3 vN;varying vec3 vW;varying vec2 vUv;
        void main(){vUv=uv;vN=normalize(mat3(modelMatrix)*normal);
          vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;
          gl_Position=projectionMatrix*viewMatrix*w;}
      `,
      fragmentShader:`
        uniform float uTime,uStorm,uInterior,uFlash,uWaterY;uniform vec3 uTint;varying vec3 vN;varying vec3 vW;varying vec2 vUv;
        void main(){
          vec3 V=normalize(cameraPosition-vW);
          float fres=pow(1.-abs(dot(normalize(vN),V)),2.8);
          float sheen=pow(.5+.5*sin((vUv.x*1.7+vUv.y*5.4)*6.283+uTime*.04),22.)*.018;
          float band=exp(-pow((vUv.y-.55)*7.5,2.))* .026;
          float horizon=smoothstep(.35,.95,vUv.y);
          vec3 c=mix(vec3(.24,.47,.5),uTint,horizon*.55+.2);
          c+=vec3(.55,.68,.7)*sheen*8.;
          float below=smoothstep(uWaterY+.13,uWaterY-.16,vW.y);
          vec3 deepGlass=mix(vec3(.018,.105,.125),uTint*.25,.35+uStorm*.1);
          c=mix(c,deepGlass,below*.66);
          float wline=exp(-pow((vW.y-uWaterY)*13.,2.));
          c+=vec3(.62,.82,.8)*wline*.16;
          float a=(.014+fres*.13+sheen+band)*(1.-.74*uInterior);
          a+=below*.038*(1.-uInterior*.65);
          a+=wline*.09;
          a+=uFlash*.06*(1.-uInterior*.7);
          gl_FragColor=vec4(c,a);
        }
      `
    });
    const geo=new THREE.PlaneGeometry(SIZE,SIZE);
    scene.userData.glassMat=glassMat;
    const faces=[
      {p:[HALF,CUBE_Y,0],r:[0,Math.PI/2,0]},
      {p:[-HALF,CUBE_Y,0],r:[0,-Math.PI/2,0]},
      {p:[0,CUBE_Y,HALF],r:[0,Math.PI,0]},
      {p:[0,CUBE_Y,-HALF],r:[0,0,0]},
      {p:[0,TOP,0],r:[Math.PI/2,0,0]},
      {p:[0,BOTTOM,0],r:[-Math.PI/2,0,0]}
    ];
    faces.forEach(f=>{
      const m=new THREE.Mesh(geo,glassMat);
      m.position.set(...f.p); m.rotation.set(...f.r); m.renderOrder=22; scene.add(m);
    });
  }

  function buildUnderwaterVolume(){
    const h=WATER_Y-BOTTOM-.08;
    const box=new THREE.Mesh(new THREE.BoxGeometry(SIZE-.01,h,SIZE-.01),new THREE.ShaderMaterial({
      transparent:true,side:THREE.BackSide,depthWrite:false,fog:false,
      uniforms:{
        uTop:{value:DAWN.underMid.clone().multiplyScalar(.62)},uBottom:{value:DAWN.underDeep.clone()},
        uLight:{value:DAWN.underLight.clone()},uStorm:{value:weather},uFlash:{value:0},uTime:{value:0}
      },
      vertexShader:`varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
      fragmentShader:`
        uniform vec3 uTop,uBottom,uLight;uniform float uStorm,uFlash,uTime;varying vec3 vW;
        float hash(vec2 p){p=fract(p*vec2(123.34,345.45));p+=dot(p,p+34.345);return fract(p.x*p.y);}
        float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
          return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
        float fbm(vec2 p){float v=0.,a=.55;for(int i=0;i<3;i++){v+=a*noise(p);p=p*2.05+3.7;a*=.5;}return v;}
        void main(){
          float d=clamp((${WATER_Y.toFixed(2)}-vW.y)/${(WATER_Y-BOTTOM).toFixed(2)},0.,1.);
          vec3 c=mix(uTop,uBottom,smoothstep(.02,1.,pow(d,.72)));
          c*=mix(vec3(1.),vec3(.76,.9,.96),uStorm);
          float ca=pow(.5+.5*sin(vW.x*2.7+vW.z*1.9+uTime*.2+fbm(vec2(vW.x,vW.z)*1.5)*4.),8.);
          c+=uLight*ca*(.08+.12*uStorm)*(1.-d*.4);
          c+=uLight*.035*(1.-d);
          c+=uFlash*vec3(.28,.45,.6)*.35;
          float a=(.80+.18*pow(d,.8))*(.96+uStorm*.04);
          gl_FragColor=vec4(c,a);
        }
      `
    }));
    box.position.y=(BOTTOM+WATER_Y)*.5; box.renderOrder=-5;
    scene.add(box); scene.userData.waterVolume=box;
  }

  function buildSeabed(){
    const geo=new THREE.PlaneGeometry(SIZE-.5,SIZE-.5,64,64);
    const p=geo.attributes.position;
    for(let i=0;i<p.count;i++){
      const x=p.getX(i), y=p.getY(i);
      p.setZ(i, Math.sin(x*1.7+y*.8)*.07+Math.sin(y*2.7-x*1.3)*.045+Math.sin(x*5.1-y*4.2)*.016);
    }
    geo.computeVertexNormals();
    const bedMat=new THREE.ShaderMaterial({
      uniforms:{uTime:{value:0},uLight:{value:1},uStorm:{value:weather},uFlash:{value:0}},
      vertexShader:`varying vec2 vUv;varying vec3 vN;void main(){vUv=uv;vN=normalize(mat3(modelMatrix)*normal);
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
      fragmentShader:`
        uniform float uTime,uLight,uStorm,uFlash;varying vec2 vUv;varying vec3 vN;
        float hash(vec2 p){p=fract(p*vec2(123.34,345.45));p+=dot(p,p+34.345);return fract(p.x*p.y);}
        float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
          return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
        float fbm(vec2 p){float v=0.,a=.55;for(int i=0;i<4;i++){v+=a*noise(p);p=p*2.04+4.1;a*=.5;}return v;}
        void main(){
          vec2 p=vUv*5.2;
          float sand=fbm(p*1.5);
          vec3 base=mix(vec3(.012,.038,.047),vec3(.055,.11,.108),sand*.6+.18);
          float ca=pow(.5+.5*sin(p.x*5.4+p.y*3.1+uTime*.35+fbm(p*2.2)*5.),7.);
          base+=vec3(.08,.28,.27)*ca*.32*uLight*(.4+uStorm*.3);
          float edge=smoothstep(0.,.09,vUv.x)*smoothstep(1.,.91,vUv.x)*smoothstep(0.,.09,vUv.y)*smoothstep(1.,.91,vUv.y);
          base+=uFlash*vec3(.12,.22,.28)*.35;
          gl_FragColor=vec4(base,edge);
        }
      `,
      transparent:true, depthWrite:true
    });
    const bed=new THREE.Mesh(geo,bedMat);
    bed.rotation.x=-Math.PI/2; bed.position.y=BOTTOM+.09; scene.add(bed); scene.userData.bed=bed;

    const rockMat=new THREE.MeshStandardMaterial({color:'#122934',roughness:.94,metalness:.02});
    for(let i=0;i<18;i++){
      const m=new THREE.Mesh(new THREE.DodecahedronGeometry(rand(.045,.16),0),rockMat);
      const a=rand(0,Math.PI*2), r=rand(1.5,3.85);
      m.position.set(Math.cos(a)*r,BOTTOM+.12+rand(-.02,.03),Math.sin(a)*r);
      m.scale.set(rand(.65,1.5),rand(.35,.7),rand(.7,1.35));
      m.rotation.set(rand(0,3),rand(0,3),rand(0,3)); scene.add(m);
    }

    const kelpMat=new THREE.MeshStandardMaterial({color:'#1d4748',roughness:.9,side:THREE.DoubleSide,transparent:true,opacity:.66});
    for(let i=0;i<11;i++){
      const h=rand(.35,1.15);
      const g=new THREE.PlaneGeometry(rand(.032,.065),h,1,5); g.translate(0,h*.5,0);
      const m=new THREE.Mesh(g,kelpMat);
      const a=rand(0,Math.PI*2), r=rand(2.5,4.0);
      m.position.set(Math.cos(a)*r,BOTTOM+.1,Math.sin(a)*r);
      m.rotation.y=rand(0,Math.PI);
      m.userData.ph=rand(0,6.3); m.userData.baseY=m.rotation.y;
      scene.userData.kelp=scene.userData.kelp||[]; scene.userData.kelp.push(m); scene.add(m);
    }

  function buildOcean(){
    const geo=new THREE.PlaneGeometry(SIZE+.8,SIZE+.8,250,250);
    geo.rotateX(-Math.PI/2);
    waterUniforms={
      uTime:{value:0},uStorm:{value:weather},uWaveGain:{value:waveGain},
      uDeep:{value:DAWN.deep.clone()},uShallow:{value:DAWN.shallow.clone()},
      uSkyTop:{value:DAWN.skyTop.clone()},uSkyHorizon:{value:DAWN.skyHorizon.clone()},
      uSun:{value:DAWN.sun.clone()},uFoam:{value:DAWN.foam.clone()},
      uUnderDeep:{value:DAWN.underDeep.clone()},uUnderGlow:{value:DAWN.underLight.clone()},
      uSunDir:{value:new THREE.Vector3(-.55,.38,.55).normalize()},
      uSunI:{value:1.15},uShip:{value:new THREE.Vector2()},uShipHeading:{value:0},uFlash:{value:0}
    };
    const mat=new THREE.ShaderMaterial({
      uniforms:waterUniforms, side:THREE.DoubleSide,
      vertexShader:`
        uniform float uTime,uWaveGain;
        varying vec3 vW;varying vec3 vN;varying float vH;varying float vChop;varying vec2 vXZ;
        void main(){
          vec2 p=position.xz;
          float h=0.,dhx=0.,dhz=0.,chop=0.;
          vec3 displaced=position;
          ${glslWaves()}
          float micro=sin(p.x*14.1+uTime*1.3)*sin(p.y*11.7-uTime*1.05);
          h+=micro*.006*uWaveGain;
          dhx+=cos(p.x*14.1+uTime*1.3)*sin(p.y*11.7-uTime*1.05)*.0846*uWaveGain;
          dhz+=sin(p.x*14.1+uTime*1.3)*cos(p.y*11.7-uTime*1.05)*.0702*uWaveGain;
          displaced.y=h;
          vec3 n=normalize(vec3(-dhx,1.,-dhz));
          vec4 w=modelMatrix*vec4(displaced,1.);
          vW=w.xyz; vN=normalize(mat3(modelMatrix)*n); vH=h/max(.18,.34*uWaveGain); vChop=chop; vXZ=p;
          gl_Position=projectionMatrix*viewMatrix*w;
        }

  function hullGeometry(){
    const sections=[
      [-.42,.065,.042,.018],[-.31,.11,.055,-.015],[-.12,.14,.068,-.045],
      [.10,.145,.070,-.055],[.30,.11,.060,-.025],[.47,.065,.048,.005],[.55,.018,.038,.02]
    ];
    const pos=[],idx=[];
    for(const [z,w,deck,keel] of sections){
      pos.push(0,keel,z, -w*.72,(deck+keel)*.45,z, -w,deck,z, w,deck,z, w*.72,(deck+keel)*.45,z);
    }
    for(let s=0;s<sections.length-1;s++)for(let j=0;j<5;j++){
      const a=s*5+j,b=s*5+(j+1)%5,c=(s+1)*5+j,d=(s+1)*5+(j+1)%5;
      idx.push(a,b,c,b,d,c);
    }
    for(let j=1;j<4;j++) idx.push(0,j,j+1);
    const base=(sections.length-1)*5;
    for(let j=1;j<4;j++) idx.push(base,base+j+1,base+j);
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();return g;
  }

  function makeBolt(){
    const line=lightningGroup.userData.line;
    const arr=line.geometry.attributes.position.array;
    let n=0;
    const cx=rand(-2.9,2.9), cz=rand(-2.8,2.8);
    const topY=TOP-.08, botY=WATER_Y+.25;
    function seg(ax,ay,az,bx,by,bz){
      if(n/3>=178)return;
      const k=n; arr[k]=ax;arr[k+1]=ay;arr[k+2]=az;
      arr[k+3]=bx;arr[k+4]=by;arr[k+5]=bz;n+=6;
    }
    const steps=17;
    let px=cx,pz=cz,py=topY;
    const pts=[];
    for(let i=1;i<=steps;i++){
      const y=topY+(botY-topY)*(i/steps);
      const nx=(i===steps?cx:px+rand(-.14,.14));
      const nz=(i===steps?cz:pz+rand(-.13,.13));
      seg(px,py,pz,nx,y,nz); pts.push([nx,y,nz]); px=nx;py=y;pz=nz;
    }
    for(let b=0;b<4;b++){
      const base=pts[Math.floor(rand(4,14))];
      let bx=base[0],by=base[1],bz=base[2];
      const stepsB=Math.floor(rand(2,6));
      for(let i=0;i<stepsB;i++){
        const nx=bx+rand(-.26,.26), ny=by-rand(.04,.22), nz=bz+rand(-.22,.22);
        seg(bx,by,bz,nx,ny,nz); bx=nx;by=ny;bz=nz;
      }
    }
    line.geometry.setDrawRange(0,n/3);
    line.geometry.attributes.position.needsUpdate=true;
  }

  const _rp=new THREE.Plane(), _rn=new THREE.Vector3(0,1,0), _rw=new THREE.Vector3(0,FLOOR_Y,0);
  const _rc=new THREE.Vector3(), _rm=new THREE.Matrix4(), _rl=new THREE.Vector3(), _rtg=new THREE.Vector3();
  const _rq=new THREE.Vector4(), _rv=new THREE.Vector3(), _rclip=new THREE.Vector4();
  function updateReflection(){
    if(!reflectionRT||!reflectionCamera)return;
    camera.updateMatrixWorld();
    _rc.setFromMatrixPosition(camera.matrixWorld);
    _rv.subVectors(_rw,_rc);
    if(_rv.dot(_rn)>0)return;
    _rv.reflect(_rn).negate().add(_rw);
    _rm.extractRotation(camera.matrixWorld);
    _rl.set(0,0,-1).applyMatrix4(_rm).add(_rc);
    _rtg.subVectors(_rw,_rl);
    _rtg.reflect(_rn).negate().add(_rw);
    reflectionCamera.position.copy(_rv);
    reflectionCamera.up.set(0,1,0).applyMatrix4(_rm).reflect(_rn);
    reflectionCamera.lookAt(_rtg);
    reflectionCamera.far=camera.far;
    reflectionCamera.updateMatrixWorld();
    reflectionCamera.projectionMatrix.copy(camera.projectionMatrix);
    reflectionMatrix.set(
      .5,0,0,.5,
      0,.5,0,.5,
      0,0,.5,.5,
      0,0,0,1
    );
    reflectionMatrix.multiply(reflectionCamera.projectionMatrix);
    reflectionMatrix.multiply(reflectionCamera.matrixWorldInverse);
    _rp.setFromNormalAndCoplanarPoint(_rn,_rw);
    _rp.applyMatrix4(reflectionCamera.matrixWorldInverse);
    _rclip.set(_rp.normal.x,_rp.normal.y,_rp.normal.z,_rp.constant);
    const pm=reflectionCamera.projectionMatrix;
    _rq.x=(Math.sign(_rclip.x)+pm.elements[8])/pm.elements[0];
    _rq.y=(Math.sign(_rclip.y)+pm.elements[9])/pm.elements[5];
    _rq.z=-1.0;
    _rq.w=(1.0+pm.elements[10])/pm.elements[14];
    _rclip.multiplyScalar(2.0/_rclip.dot(_rq));
    pm.elements[2]=_rclip.x;
    pm.elements[6]=_rclip.y;
    pm.elements[10]=_rclip.z+1.0-.003;
    pm.elements[14]=_rclip.w;

    const hidden=[];
    const hide=(o)=>{if(o&&o.visible){hidden.push(o);o.visible=false;}};
    hide(scene.userData.floor); hide(scene.userData.sheen); hide(scene.userData.pool);
    hide(scene.userData.shadow); hide(airMotes); hide(rain);
    const current=renderer.getRenderTarget();
    renderer.setRenderTarget(reflectionRT);
    renderer.clear();
    renderer.render(scene,reflectionCamera);
    renderer.setRenderTarget(current);
    for(const o of hidden)o.visible=true;
  }

  function bindEvents(){
    slider.addEventListener('input',()=>{
      weatherTarget=parseInt(slider.value,10)/1000;
      if(!underwater) hint.classList.add('hide');
    });
    addEventListener('resize',onResize);
    document.querySelector('#reset').addEventListener('click',resetView);
    document.querySelector('#reset').addEventListener('pointerdown',e=>e.stopPropagation());

    const down={x:0,y:0,active:false};
    renderer.domElement.addEventListener('pointerdown',e=>{
      if(e.button!==0)return;
      down.x=e.clientX;down.y=e.clientY;down.active=true;
    },{passive:true});
    renderer.domElement.addEventListener('pointerup',e=>{
      if(!down.active)return;
      down.active=false;
      if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>7||cameraAnim)return;
      if(!underwater&&pickWhale(e))descendToWhale();
    },{passive:true});
    renderer.domElement.addEventListener('pointermove',e=>{
      if(cameraAnim||underwater){if(whaleHover){whaleHover=false;renderer.domElement.style.cursor='default';}return;}
      const h=pickWhale(e);
      if(h!==whaleHover){
        whaleHover=h;
        renderer.domElement.style.cursor=h?'pointer':'default';
      }
    },{passive:true});
    renderer.domElement.addEventListener('pointerleave',()=>{
      if(whaleHover){whaleHover=false;renderer.domElement.style.cursor='default';}
    },{passive:true});
    addEventListener('keydown',e=>{
      if(e.key==='r'||e.key==='R')resetView();
    });
  }

  function onResize(){
    const w=innerWidth,h=innerHeight;
    camera.aspect=w/h;
    if(!cameraAnim){
      camera.fov=underwater?(w/h<.85?72:58):(w/h<.85?56:36);
      camera.updateProjectionMatrix();
    }
    renderer.setSize(w,h);
    composer.setSize(w,h);
    bloom.setSize(w,h);
  }

  function pickWhale(e){
    if(!whale)return false;
    pointerNDC.x=(e.clientX/innerWidth)*2-1;
    pointerNDC.y=-(e.clientY/innerHeight)*2+1;
    raycaster.setFromCamera(pointerNDC,camera);
    return raycaster.intersectObjects(whaleHit,false).length>0;
  }

  function cameraTo(pos,target,fov,dur,done){
    cameraAnim={fromP:camera.position.clone(),toP:pos.clone(),fromT:controls.target.clone(),toT:target.clone(),fromF:camera.fov,toF:fov,t:0,dur,done};
    controls.enabled=false;
  }

  function descendToWhale(){
    if(underwater||cameraAnim)return;
    underwater=true;
    document.body.classList.add('underwater');
    hint.classList.add('hide'); hint.dataset.used='1';
    conditionEl.textContent='Below the surface';
    const target=whale.position.clone().add(new THREE.Vector3(0,.18,0));
    const pos=target.clone().add(new THREE.Vector3(3.9,.9,3.9));
    pos.y=clamp(pos.y,BOTTOM+1.1,WATER_Y-.7);
    cameraTo(pos,target,innerWidth/innerHeight<.85?72:58,3.0,()=>{
      controls.enabled=true;controls.update();
      setTimeout(()=>{if(underwater){conditionEl.textContent='Underwater viewing';}},800);
    });
    controls.minDistance=1.4; controls.maxDistance=10; controls.minPolarAngle=.12; controls.maxPolarAngle=2.38;
  }

  function resetView(){
    if(cameraAnim&&!underwater)return;
    underwater=false;document.body.classList.remove('underwater');
    hint.classList.remove('hide');delete hint.dataset.used;
    controls.minDistance=7.3;controls.maxDistance=25;controls.minPolarAngle=.22;controls.maxPolarAngle=1.5;
    cameraTo(HOME_POS,HOME_TARGET,innerWidth/innerHeight<.85?56:36,2.7,()=>{
      controls.enabled=true;controls.update();
      conditionEl.textContent=conditionFor(weather);
    });
  }

  function updateShip(dt,t){
    if(!ship)return;
    const storm=weather;
    const sx=.1+Math.sin(t*.14)*.62+Math.sin(t*.43)*.065*storm;
    const sz=1.05+Math.cos(t*.11+1.1)*.48+Math.sin(t*.31+.4)*.045*storm;
    const heading=.2*Math.sin(t*.12+.3)+.11*Math.sin(t*.4)*storm;
    const hC=waveHeight(sx,sz,t,waveGain);
    const hF=waveHeight(sx+Math.sin(heading)*.47,sz+Math.cos(heading)*.47,t,waveGain);
    const hB=waveHeight(sx-Math.sin(heading)*.38,sz-Math.cos(heading)*.38,t,waveGain);
    const hR=waveHeight(sx+Math.cos(heading)*.12,sz-Math.sin(heading)*.12,t,waveGain);
    const hL=waveHeight(sx-Math.cos(heading)*.12,sz+Math.sin(heading)*.12,t,waveGain);
    const targetPitch=clamp(-Math.atan2(hF-hB,.85),-.42,.42)+Math.sin(t*2.6)*.013*storm;
    const targetRoll=clamp(Math.atan2(hR-hL,.24),-.58,.58)+Math.cos(t*3.3)*.018*storm;
    const targetY=WATER_Y+hC+.078+Math.sin(t*4.4)*.008*storm;
    const k=1-Math.exp(-dt*8.5);
    shipY=lerp(shipY,targetY,k);
    shipPitch=lerp(shipPitch,targetPitch,1-Math.exp(-dt*6.5));
    shipRoll=lerp(shipRoll,targetRoll,1-Math.exp(-dt*6.0));
    ship.position.set(sx,shipY,sz);
    ship.rotation.set(shipPitch,heading,shipRoll,'YXZ');
    if(ship.userData.light)ship.userData.light.intensity=(.32+weather*.26)*(.78+.22*Math.sin(t*5.2));
    waterUniforms.uShip.value.set(sx,sz);
    waterUniforms.uShipHeading.value=heading;
  }

  let dummyFish;
  function updateFish(t){
    if(!fishMesh)return;
    dummyFish=dummyFish||new THREE.Object3D();
    for(let i=0;i<fishData.length;i++){
      const f=fishData[i];
      const a=f.a+t*f.speed*(1+weather*.32);
      const rr=f.r*(1+Math.sin(t*.27+f.ph)*.12);
      const cx=f.cx+Math.sin(t*.11+f.ph)*.18;
      const cz=f.cz+Math.cos(t*.09+f.ph)*.14;
      const x=cx+Math.cos(a)*rr;
      const z=cz+Math.sin(a)*rr;
      const y=f.cy+f.y+Math.sin(a*1.6+t*.4)*.12;
      dummyFish.position.set(x,y,z);
      dummyFish.rotation.set(0,-a-Math.PI*.5,Math.sin(a*2.+t*3.)*.09);
      dummyFish.scale.setScalar(f.scale);
      dummyFish.updateMatrix();
      fishMesh.setMatrixAt(i,dummyFish.matrix);
    }
    fishMesh.instanceMatrix.needsUpdate=true;
    fishMesh.material.opacity=.48+weather*.12;
  }

  function updateParticles(dt,t){
    if(!particles)return;
    const pp=particles.geometry.attributes.position.array;
    for(let i=0;i<particleData.length;i++){
      const d=particleData[i];
      d.y+=dt*d.v*(.6+weather*.8);
      d.a+=dt*.018*d.sw*(.35+weather*.7);
      if(d.y>WATER_Y-.12)d.y=BOTTOM+rand(.2,.7);
      pp[i*3]=Math.cos(d.a)*d.r;pp[i*3+1]=d.y;pp[i*3+2]=Math.sin(d.a)*d.r;
    }
    particles.geometry.attributes.position.needsUpdate=true;
    particles.material.opacity=.25+weather*.28;
    if(airMotes){
      const ap=airMotes.geometry.attributes.position.array;
      for(let i=0;i<airData.length;i++){
        const d=airData[i];d.y+=dt*d.v;d.a+=dt*.002;
        if(d.y>13)d.y=FLOOR_Y+.2;
        ap[i*3]=Math.cos(d.a)*d.r;ap[i*3+1]=d.y;ap[i*3+2]=Math.sin(d.a)*d.r;
      }
      airMotes.geometry.attributes.position.needsUpdate=true;
    }
  }

  function animate(){
    requestAnimationFrame(animate);
    if(!ready)return;
    const dt=Math.min(clock.getDelta(),.05);
    elapsed+=dt;
    updateWeather(dt);
    const t=elapsed, storm=weather;

    waterUniforms.uTime.value=t;
    waterUniforms.uStorm.value=storm;
    waterUniforms.uWaveGain.value=waveGain;
    waterUniforms.uSunDir.value.set(-.55+.18*storm,.38-.12*storm,.55+.08*storm).normalize();
    scene.userData.dome.material.uniforms.uTime.value=t;
    scene.userData.halo.material.uniforms.uFlash.value=flashLevel*.35;
    glassMat.uniforms.uTime.value=t;
    scene.userData.shaftMat.uniforms.uTime.value=t;
    scene.userData.shaftMat.uniforms.uStorm.value=storm;
    scene.userData.waterVolume.material.uniforms.uTime.value=t;
    scene.userData.waterVolume.material.uniforms.uStorm.value=storm;
    scene.userData.bed.material.uniforms.uTime.value=t;

    // ship
    updateShip(dt,t);

    // whale drift
    const wx=Math.sin(t*.061)*.55+Math.sin(t*.17)*.08;
    const wz=Math.cos(t*.047+.6)*.38;
    whale.position.set(wx,2.95+Math.sin(t*.13+.4)*.11-storm*.035,wz);
    whale.rotation.y=2.28+.12*Math.sin(t*.05+.7);
    whale.rotation.z=.022*Math.sin(t*.1);
    whale.rotation.x=.012*Math.sin(t*.08+.2);
    whale.userData.tail.rotation.x=.34+.11*Math.sin(t*.9)*(.55+storm*.25);
    if(whale.userData.causticMat){whale.userData.causticMat.uniforms.uTime.value=t;whale.userData.causticMat.uniforms.uOpacity.value=.055+weather*.05+whaleHover*.035;}
    whale.userData.fins[0].rotation.z=.14+.02*Math.sin(t*.4);
    whale.userData.fins[1].rotation.z=-.14-.02*Math.sin(t*.4+.7);
    const clickTarget=whale.position.clone().add(new THREE.Vector3(0,.18,0));
    if(whaleHover){
      whaleRimMat.uniforms.uOpacity.value=lerp(whaleRimMat.uniforms.uOpacity.value,.64,1-Math.exp(-dt*7));
      whale.userData.halo.opacity=lerp(whale.userData.halo.opacity,.24,1-Math.exp(-dt*6));
    }else{
      whaleRimMat.uniforms.uOpacity.value=lerp(whaleRimMat.uniforms.uOpacity.value,.38,1-Math.exp(-dt*5));
      whale.userData.halo.opacity=lerp(whale.userData.halo.opacity,.15,1-Math.exp(-dt*4));
    }

    // fish + particles + kelp
    updateFish(t);
    updateParticles(dt,t);
    if(scene.userData.kelp)for(const k of scene.userData.kelp){
      k.rotation.z=Math.sin(t*.65+k.userData.ph)*.06;
      k.rotation.y=k.userData.baseY+Math.sin(t*.32+k.userData.ph)*.1;
    }

    // underwater fade of the glass, and a gentle tracking target while submerged
    interiorFade=lerp(interiorFade,underwater?1:0,1-Math.exp(-dt*2.8));
    glassMat.uniforms.uInterior.value=interiorFade;

    // rain / lightning
    updateRain(dt);
    if(storm>.54 && t>nextStrike && !cameraAnim)strike();
    if(flashLevel>.001){
      flashLevel*=Math.pow(.012,dt);
      const flicker=flashLevel*(.58+.42*Math.sin(t*86.));
      scene.userData.flash.intensity=flicker*82;
      lightningMat.opacity=clamp(flicker*1.4,0,1);
      lightningGroup.visible=flashLevel>.008;
      flashEl.style.opacity=String(clamp(flicker*.032,0,.05));
      const uf=flicker*.42;
      const u=scene.userData.dome.material.uniforms;u.uFlash.value=flicker*.065;
      scene.userData.glassMat.uniforms.uFlash.value=uf;
      scene.userData.shaftMat.uniforms.uFlash.value=uf;
      scene.userData.waterVolume.material.uniforms.uFlash.value=uf;
      scene.userData.bed.material.uniforms.uFlash.value=uf;
      waterUniforms.uFlash.value=uf;
    }else{
      lightningGroup.visible=false;flashEl.style.opacity='0';
      const u=scene.userData.dome.material.uniforms;u.uFlash.value=0;
      scene.userData.glassMat.uniforms.uFlash.value=0;
      scene.userData.shaftMat.uniforms.uFlash.value=0;
      scene.userData.waterVolume.material.uniforms.uFlash.value=0;
      scene.userData.bed.material.uniforms.uFlash.value=0;
      waterUniforms.uFlash.value=0;
    }

    // camera transitions
    if(cameraAnim){
      cameraAnim.t+=dt;
      const k=clamp(cameraAnim.t/cameraAnim.dur,0,1);
      const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
      camera.position.lerpVectors(cameraAnim.fromP,cameraAnim.toP,e);
      controls.target.lerpVectors(cameraAnim.fromT,cameraAnim.toT,e);
      camera.fov=lerp(cameraAnim.fromF,cameraAnim.toF,e);
      camera.updateProjectionMatrix();
      camera.lookAt(controls.target);
      if(k>=1){const done=cameraAnim.done;cameraAnim=null;if(done)done();}
    }else{
      controls.update();
    }

    // low underwater drift of the whale in frame
    if(underwater&&!cameraAnim){
      const delta=clickTarget.clone().sub(controls.target).multiplyScalar(.018);
      controls.target.add(delta);camera.position.add(delta);
    }

    renderer.toneMappingExposure=lerp(1.06,1.22,storm)+flashLevel*.045;
    updateReflection();
    composer.render();
  }

  window.__sea={
    state:()=>({weather,weatherTarget,underwater,animating:!!cameraAnim,pos:camera?.position.toArray(),target:controls?.target.toArray(),whale:whale?.position.toArray(),ship:ship?.position.toArray()}),
    setWeather:(v)=>{slider.value=String(Math.round(v*1000));weatherTarget=v;weather=v;refreshWeatherPalette(v);},
    descend:descendToWhale,reset:resetView,strike,
    get scene(){return scene},get camera(){return camera},get controls(){return controls},get whale(){return whale},get ship(){return ship}
  };

  try{init();}catch(err){
    console.error(err);
    document.querySelector('#err').style.display='grid';
  }
  </script>
</body>
</html>
