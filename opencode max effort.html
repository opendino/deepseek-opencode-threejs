  bgSun: new THREE.Color(0x102a3a),
  bgStorm: new THREE.Color(0x03070f),
  shaftSun: new THREE.Color(0xffddb0),
  shaftStorm: new THREE.Color(0x8ac6ef),
  particleSun: new THREE.Color(0x8ed9dd),
  particleStorm: new THREE.Color(0x7aa6e6),
  particleWarmSun: new THREE.Color(0xffc98f),
  particleWarmStorm: new THREE.Color(0x9eb9ff),
  rainSun: new THREE.Color(0xa9d0d8),
  rainStorm: new THREE.Color(0xa7c1ef),
  glassSun: new THREE.Color(0xc4e8f2),
  glassStorm: new THREE.Color(0x8bb8d8),
  hemiSun: new THREE.Color(0x2f5c7e),
  hemiStorm: new THREE.Color(0x16273c)
};

const C = {
  skyTop: new THREE.Color(),
  skyHorizon: new THREE.Color(),
  cloudLight: new THREE.Color(),
  cloudDark: new THREE.Color(),
  sun: new THREE.Color(),
  waterDeep: new THREE.Color(),
  waterShallow: new THREE.Color(),
  foam: new THREE.Color(),
  under: new THREE.Color(),
  key: new THREE.Color(),
  fill: new THREE.Color(),
  rim: new THREE.Color(),
  underLight: new THREE.Color(),
  bg: new THREE.Color(),
  shaft: new THREE.Color(),
  particle: new THREE.Color(),
  particleWarm: new THREE.Color(),
  rain: new THREE.Color(),
  glass: new THREE.Color(),
  hemi: new THREE.Color()
};
const celestialDir = new THREE.Vector3();
const lightLerp = new THREE.Vector3();
const flashColor = new THREE.Color();

function applyWeather(storm, time, flash) {
  const s = clamp01(storm);

  /* Interpolating very bright sunrise colors into near-black storm colors in
     linear space would leave a sepia cast. Pull the color transition forward
     so the midnight palette actually arrives at midnight. */
  const colorT = smoothstep(0.10, 0.72, s);
  C.skyTop.copy(P.skyTopSun).lerp(P.skyTopStorm, colorT);
  C.skyHorizon.copy(P.skyHorizonSun).lerp(P.skyHorizonStorm, colorT);
  C.cloudLight.copy(P.cloudLightSun).lerp(P.cloudLightStorm, colorT);
  C.cloudDark.copy(P.cloudDarkSun).lerp(P.cloudDarkStorm, colorT);
  C.sun.copy(P.sunSun).lerp(P.sunStorm, colorT);
  C.waterDeep.copy(P.waterDeepSun).lerp(P.waterDeepStorm, colorT);
  C.waterShallow.copy(P.waterShallowSun).lerp(P.waterShallowStorm, colorT);
  C.foam.copy(P.foamSun).lerp(P.foamStorm, colorT);
  C.under.copy(P.underSun).lerp(P.underStorm, colorT);
  C.key.copy(P.keySun).lerp(P.keyStorm, colorT);
  C.fill.copy(P.fillSun).lerp(P.fillStorm, colorT);
  C.rim.copy(P.rimSun).lerp(P.rimStorm, colorT);
  C.underLight.copy(P.underLightSun).lerp(P.underLightStorm, colorT);
  C.bg.copy(P.bgSun).lerp(P.bgStorm, colorT);
  C.shaft.copy(P.shaftSun).lerp(P.shaftStorm, colorT);
  C.particle.copy(P.particleSun).lerp(P.particleStorm, colorT);
  C.particleWarm.copy(P.particleWarmSun).lerp(P.particleWarmStorm, colorT);
  C.rain.copy(P.rainSun).lerp(P.rainStorm, colorT);
  C.glass.copy(P.glassSun).lerp(P.glassStorm, colorT);
  C.hemi.copy(P.hemiSun).lerp(P.hemiStorm, colorT);

  const sunVis = 1.0 - smoothstep(0.24, 0.82, s);
  const moonVis = smoothstep(0.26, 0.84, s);
  const cloudCoverage = 0.24 + s * 0.72;

  celestialDir.copy(SUN_DIR).lerp(MOON_DIR, smoothstep(0.20, 0.88, s)).normalize();

  /* Sky */
  skyUniforms.uTop.value.copy(C.skyTop);
  skyUniforms.uHorizon.value.copy(C.skyHorizon);
  skyUniforms.uCloudLight.value.copy(C.cloudLight);
  skyUniforms.uCloudDark.value.copy(C.cloudDark);
  skyUniforms.uSunColor.value.copy(C.sun);
  skyUniforms.uSunVis.value = sunVis;
  skyUniforms.uMoonVis.value = moonVis;
  skyUniforms.uCloudCoverage.value = cloudCoverage;
  skyUniforms.uStars.value = smoothstep(0.45, 0.92, s) * 0.82;
  skyUniforms.uFlash.value = flash;
  skyUniforms.uTime.value = time;

  /* Ocean */
  const waveScale = 0.80 + 3.30 * s;
  oceanUniforms.uTime.value = time;
  oceanUniforms.uWaveScale.value = waveScale;
  oceanUniforms.uStorm.value = s;
  oceanUniforms.uFoamAmount.value = smoothstep(0.27, 0.90, s) * 0.96;
  oceanUniforms.uSunVis.value = 1.0 - s * 0.52;
  oceanUniforms.uSunDir.value.copy(celestialDir);
  oceanUniforms.uSunColor.value.copy(C.sun);
  oceanUniforms.uSkyTop.value.copy(C.skyTop).multiplyScalar(0.62);
  oceanUniforms.uSkyHorizon.value.copy(C.skyHorizon).multiplyScalar(0.58);
  oceanUniforms.uWaterDeep.value.copy(C.waterDeep);
  oceanUniforms.uWaterShallow.value.copy(C.waterShallow);
  oceanUniforms.uFoamColor.value.copy(C.foam);
  oceanUniforms.uUnderColor.value.copy(C.under);
  oceanUniforms.uFlash.value = flash;

  /* Water volume */
  waterUniforms.uTime.value = time;
  waterUniforms.uStorm.value = s;
  waterUniforms.uDeep.value.copy(C.waterDeep).multiplyScalar(1.05);
  waterUniforms.uShallow.value.copy(C.waterShallow).multiplyScalar(1.02);
  waterUniforms.uCaustic.value.copy(C.under);
  waterUniforms.uOpacity.value = 0.84 + s * 0.12;

  /* Light shafts */
  for (const entry of shaftMats) {
    entry.material.uniforms.uTime.value = time;
    entry.material.uniforms.uColor.value.copy(C.shaft);
    entry.material.uniforms.uIntensity.value = entry.baseIntensity * (1.0 - s * 0.36) * 0.90;
  }

  /* Particles */
  particleUniforms.uTime.value = time;
  particleUniforms.uColor.value.copy(C.particle);
  particleUniforms.uWarmColor.value.copy(C.particleWarm);
  particleUniforms.uOpacity.value = 0.64 - s * 0.12;

  /* Rain */
  rainUniforms.uTime.value = time;
  rainUniforms.uRainAmount.value = smoothstep(0.34, 0.86, s);
  rainUniforms.uColor.value.copy(C.rain);
  rainUniforms.uOpacity.value = 0.34 + s * 0.22;
  rainUniforms.uWind.value = 0.04 + s * 0.11;

  /* Glass */
  glassUniforms.uTint.value.copy(C.glass);
  glassUniforms.uSunColor.value.copy(C.sun);
  glassUniforms.uSunDir.value.copy(celestialDir);
  glassUniforms.uFlash.value = flash;
  glassUniforms.uTime.value = time;

  /* Gallery */
  bgUniforms.uGlowColor.value.copy(C.bg);
  bgUniforms.uStorm.value = s;
  bgUniforms.uTime.value = time;
  floorFadeUniforms.uTime.value = time;

  /* Lights */
  keyLight.color.copy(C.key);
  lightLerp.copy(KEY_SUN_POS).lerp(KEY_MOON_POS, smoothstep(0.2, 0.88, s));
  keyLight.position.copy(lightLerp);
  keyLight.intensity = (2.55 - 1.45 * s) + flash * 7.0;
  fillLight.color.copy(C.fill);
  fillLight.intensity = 1.18 - 0.22 * s + flash * 1.4;
  rimLight.color.copy(C.rim);
  rimLight.intensity = 0.78 + 1.15 * s + flash * 5.2;
  hemiLight.color.copy(C.hemi);
  hemiLight.intensity = 0.78 - 0.18 * s + flash * 0.45;
  underLight.color.copy(C.underLight);
  underLight.intensity = 27.0 - 9.0 * s + flash * 24.0;
  deepLight.color.copy(C.underLight).multiplyScalar(0.72);
  deepLight.intensity = 14.0 - 4.0 * s + flash * 13.0;
  underFill.color.copy(C.fill);
  underFill.intensity = 24.0 - 6.0 * s + flash * 12.0;
  backLight.color.copy(C.fill).multiplyScalar(0.92);
  backLight.intensity = 24.0 - 4.0 * s + flash * 9.0;

  ship.tinyWarmLight.intensity = 1.1 + s * 0.9 + flash * 0.8;
  fishMaterial.emissiveIntensity = 0.50 + s * 0.18;
  whale.skinMaterial.envMapIntensity = 0.34 - s * 0.08;
  whale.skinMaterial.emissiveIntensity = 0.30 + s * 0.08;

  /* Flash and exposure */
  boltGroup.visible = flash > 0.012;
  boltCoreMaterial.opacity = Math.min(1.0, flash * 1.8);
  boltGlowMaterial.opacity = flash * 0.34;
  flashEl.style.opacity = (flash * 0.19).toFixed(3);
  renderer.toneMappingExposure = 1.06 + (1.0 - s) * 0.035 + flash * 0.16;

  return waveScale;
}

/* --------------------------------------------------------------------------
   Lightning timing
   -------------------------------------------------------------------------- */

let flashStart = -100;
let nextLightning = (targetWeather > 0.42 || debugLightning)
  ? 2.8 + Math.random() * 3.2
  : 20 + Math.random() * 12;

function updateLightning(time) {
  if (weather < 0.31) {
    nextLightning = Math.max(nextLightning, time + 6.5);
  }

  if (weather > 0.38 && time > nextLightning) {
    flashStart = time;
    spawnBolt();
    nextLightning = time + THREE.MathUtils.lerp(15.0, 4.0, weather) * (0.55 + Math.random() * 0.95);
    debugLightning = false;
  }

  const dt = time - flashStart;
  let flash = 0;
  if (dt >= 0 && dt < 1.05) {
    const first = Math.exp(-dt * 14.0);
    const second = dt > 0.12 ? Math.exp(-(dt - 0.12) * 21.0) * 0.52 : 0;
    const third = dt > 0.29 ? Math.exp(-(dt - 0.29) * 28.0) * 0.22 : 0;
    flash = Math.min(1.0, first + second + third);
  }
  return flash;
}

/* --------------------------------------------------------------------------
   Camera choreography
   -------------------------------------------------------------------------- */

const transition = {
  active: false,
  t: 0,
  duration: 2.6,
  fromPos: new THREE.Vector3(),
  toPos: new THREE.Vector3(),
  fromTarget: new THREE.Vector3(),
  toTarget: new THREE.Vector3(),
  mode: 'home'
};
const transitionPos = new THREE.Vector3();
const transitionTarget = new THREE.Vector3();
let viewMode = startUnderwater ? 'underwater' : 'home';

function applyControlLimits(mode) {
  if (mode === 'underwater') {
    controls.minDistance = 9.0;
    controls.maxDistance = 28;
    controls.minPolarAngle = 0.48;
    controls.maxPolarAngle = 1.72;
  } else {
    controls.minDistance = 14;
    controls.maxDistance = 50;
    controls.minPolarAngle = 0.30;
    controls.maxPolarAngle = 1.62;
  }
}

function startTransition(toPos, toTarget, duration, mode) {
  transition.active = true;
  transition.t = 0;
  transition.duration = duration;
  transition.fromPos.copy(camera.position);
  transition.fromTarget.copy(controls.target);
  transition.toPos.copy(toPos);
  transition.toTarget.copy(toTarget);
  transition.mode = mode;
  controls.enabled = false;
}

function enterUnderwater() {
  if (transition.active || viewMode === 'underwater') return;
  startTransition(UNDER_POS, UNDER_TARGET, 2.8, 'underwater');
  hideHint();
}

function resetView() {
  startTransition(HOME_POS, HOME_TARGET, 2.4, 'home');
  hideHint();
}

function updateTransition(dt) {
  if (!transition.active) return;
  transition.t += dt;
  const k = Math.min(1, transition.t / transition.duration);
  const e = k < 0.5
    ? 4.0 * k * k * k
    : 1.0 - Math.pow(-2.0 * k + 2.0, 3.0) * 0.5;

  transitionPos.lerpVectors(transition.fromPos, transition.toPos, e);
  transitionTarget.lerpVectors(transition.fromTarget, transition.toTarget, e);
  camera.position.copy(transitionPos);
  camera.lookAt(transitionTarget);
  controls.target.copy(transitionTarget);

  if (k >= 1.0) {
    transition.active = false;
    camera.position.copy(transition.toPos);
    controls.target.copy(transition.toTarget);
    camera.lookAt(controls.target);
    applyControlLimits(transition.mode);
    viewMode = transition.mode;
    controls.enabled = true;
    controls.update();
  }
}

if (startUnderwater) {
  camera.position.copy(UNDER_POS);
  controls.target.copy(UNDER_TARGET);
  applyControlLimits('underwater');
  camera.lookAt(controls.target);
  controls.update();
  hideHint();
} else {
  applyControlLimits('home');
}

/* --------------------------------------------------------------------------
   Whale picking
   -------------------------------------------------------------------------- */

const raycaster = new THREE.Raycaster();
const pointerNdc = new THREE.Vector2();
let pointerDown = null;
let lastHoverCheck = 0;

function setPointerNdc(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointerNdc.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNdc.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
}

function whaleHit(event) {
  setPointerNdc(event);
  raycaster.setFromCamera(pointerNdc, camera);
  const hits = raycaster.intersectObject(whaleGroup, true);
  return hits.length > 0;
}

renderer.domElement.addEventListener('pointerdown', (event) => {
  pointerDown = { x: event.clientX, y: event.clientY };
  renderer.domElement.style.cursor = 'grabbing';
});

renderer.domElement.addEventListener('pointerup', (event) => {
  renderer.domElement.style.cursor = 'grab';
  if (!pointerDown) return;
  const dx = event.clientX - pointerDown.x;
  const dy = event.clientY - pointerDown.y;
  pointerDown = null;
  if (dx * dx + dy * dy > 64) return;
  if (transition.active || viewMode === 'underwater') return;
  if (whaleHit(event)) enterUnderwater();
});

renderer.domElement.addEventListener('pointermove', (event) => {
  if (pointerDown || event.pointerType === 'touch') return;
  const now = performance.now();
  if (now - lastHoverCheck < 90) return;
  lastHoverCheck = now;
  const hit = !transition.active && viewMode !== 'underwater' && whaleHit(event);
  renderer.domElement.style.cursor = hit ? 'pointer' : 'grab';
});

renderer.domElement.addEventListener('pointerleave', () => {
  pointerDown = null;
  renderer.domElement.style.cursor = 'grab';
});

resetEl.addEventListener('click', resetView);

rangeEl.addEventListener('input', () => {
  targetWeather = clamp01(parseFloat(rangeEl.value));
  if (targetWeather > 0.35) {
    nextLightning = Math.min(nextLightning, elapsedTime + 2.4);
  }
  hideHint();
});

/* --------------------------------------------------------------------------
   Main loop
   -------------------------------------------------------------------------- */

let elapsedTime = 0;
const clock = new THREE.Clock();
let framesRendered = 0;

/* Prime one full frame so the opening image is already alive. */
let initialWaveScale = applyWeather(weather, 0, 0);
updateShip(0, 0.016, weather, initialWaveScale);
updateFish(0);

/* A tiny debug surface for visual tuning; harmless in the finished piece. */
window.__STORM = {
  scene, camera, renderer, controls, cubeGroup, floor, floorFade, shadow,
  oceanMaterial, oceanUniforms, skyUniforms, waterMaterial, glassMaterial,
  whale, fishMesh, shipGroup, particleMaterial, rainMaterial, sunDir: SUN_DIR
};
window.__setWeather = (value) => {
  targetWeather = clamp01(Number(value));
  weather = targetWeather;
  rangeEl.value = String(targetWeather);
};
window.__enterUnderwater = enterUnderwater;
window.__resetView = resetView;
window.__triggerLightning = () => {
  flashStart = elapsedTime;
  spawnBolt();
};

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  elapsedTime += dt;
  const t = elapsedTime;

  weather = damp(weather, targetWeather, 1.7, dt);
  const flash = updateLightning(t);
  const waveScale = applyWeather(weather, t, flash);

  cubeGroup.position.y = Math.sin(t * 0.23) * 0.035;

  updateWhale(t);
  updateShip(t, dt, weather, waveScale);
  updateFish(t);
  updateTransition(dt);

  if (!transition.active) {
    controls.update();
  }

  renderer.render(scene, camera);

  framesRendered++;
  if (framesRendered === 2) {
    requestAnimationFrame(() => document.body.classList.add('ready'));
    window.setTimeout(hideHint, 9500);
  }
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  particleUniforms.uPixelRatio.value = renderer.getPixelRatio();
}

window.addEventListener('resize', onResize);

try {
  renderer.compile(scene, camera);
} catch (error) {
  console.warn('Precompile skipped:', error);
}

animate();
</script>
</body>
